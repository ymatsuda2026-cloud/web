  /* ---------- マインドマップ(共通API api/mindmap2 を呼び出して表示) ---------- */
  const linkTimecodes = (mdText, url) => { const vid = ytId(url); if (!vid) return mdText; return String(mdText).replace(/\[((?:\d{1,2}:)?\d{1,3}:\d{2})\]/g, (m, label) => `[${label}](https://www.youtube.com/watch?v=${vid}&t=${parseTc(m)}s)`); };
  function ensureMmCss(href) { if (document.querySelector('link[data-mm="1"]')) return; const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; l.dataset.mm = "1"; document.head.appendChild(l); }
  async function showMindmap() {
    const host = $("#mmHost"), b = S.curBundle, it = S.byId.get(S.cur); if (!host || !b) return;
    const raw = String(b.mindmap || "").trim();
    if (!raw) { host.innerHTML = `<p class="empty">マインドマップはまだありません。</p>`; return; }
    host.textContent = "読み込み中…";
    try {
      ensureMmCss(new URL("../api/mindmap2/mindmap2.css", location.href).href);
      const mod = await import(new URL("../api/mindmap2/mindmap2.js", location.href).href);
      if (S.view !== "mindmap" || $("#mmHost") !== host) return;
      await mod.renderMindmap(host, raw, { emptyText: "マインドマップはまだありません", decorate: m => linkTimecodes(m, b.url) });
      host.onclick = ev => {                                // 枝の時刻は、この画面のプレーヤーで再生する
        const a = ev.target.closest("a[href]"), id = a && ytId(a.href); if (!id) return;
        ev.preventDefault(); const m = a.href.match(/[?&]t=(\d+)/); playAt(id, m ? +m[1] : 0, b.title || it?.t || "");
      };
    } catch (err) {
      host.innerHTML = `<div style="padding:16px;overflow:auto;height:100%"><p class="msg" style="color:var(--danger)">共通API（/api/mindmap2/）を読み込めませんでした：${esc(err.message || err)}</p>${raw.startsWith("<") ? "<p>旧形式（HTML）のマップです。</p>" : mapHtml(parseMap(raw), b.url, 0)}</div>`;
    }
  }

  /* ---------- 重複(同じ動画・同じ記事)。変換の管理に回し、一覧には出さない ---------- */
  const dupKey = x => {
    const id = ytId(x.url); if (id) return "yt:" + id;
    const u = String(x.url || "").trim(); if (!u) return "";
    try { const o = new URL(u); o.hash = ""; [...o.searchParams.keys()].forEach(k => { if (/^(utm_|fbclid|gclid)/i.test(k)) o.searchParams.delete(k); }); return (o.origin + o.pathname.replace(/\/$/, "") + o.search).toLowerCase(); }
    catch { return u.toLowerCase(); }
  };
  const RANK = { "要約済み": 0, "完了": 1, "処理中": 2 };
  function computeDups() {                         // 同じ URL が複数あるとき、要約が進んでいる方・古い方を残し、あとは重複にする
    S.dup = new Map(); const g = new Map();
    for (const x of S.items) { const k = dupKey(x); if (k) (g.get(k) || g.set(k, []).get(k)).push(x); }
    for (const list of g.values()) if (list.length > 1) {
      list.sort((a, b) => (RANK[a.st] ?? 3) - (RANK[b.st] ?? 3) || (a.c || "").localeCompare(b.c || ""));
      for (const x of list.slice(1)) S.dup.set(x.id, list[0].id);
    }
  }
  const isDup = x => !!x && S.dup.has(x.id);
  const grp = x => isDup(x) ? "dup" : group(x.st);

  /* ---------- タグ(記録と同じ暗号化同期。Notion の「タグ」にも書き込む) ---------- */
  const effTags = x => { const o = RS.tags[x.id]; return o ? o.v : (x.tg || []); };
  const sameSet = (a, b) => a.length === b.length && a.every(t => b.includes(t));
  const cleanTag = t => String(t ?? "").replace(/^#+/, "").replace(/[,，]/g, " ").replace(/\s+/g, " ").trim().slice(0, 100);   // Notion のタグ名には、半角のカンマを使えない
  const tagOk = x => S.tag === "all" || (S.tag === "none" ? !effTags(x).length : effTags(x).includes(S.tag.slice(2)));
  function tagVocab(onlyDone) {
    const m = new Map();
    for (const x of S.items) { if (isDup(x) || (onlyDone && x.st !== "要約済み")) continue; for (const t of effTags(x)) m.set(t, (m.get(t) || 0) + 1); }
    return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
  }
  function drawTagMenu() {          // 種別を選んでいるときは、その種別の中のタグだけを出す(件数も、その種別の中)
    const kind = S.kind === "all" ? "" : S.kind.slice(2);
    const pool = S.items.filter(x => x.st === "要約済み" && !isDup(x) && (!kind || kindOf(x) === kind));
    const m = new Map(); pool.forEach(x => effTags(x).forEach(t => m.set(t, (m.get(t) || 0) + 1)));
    const voc = [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja")), none = pool.filter(x => !effTags(x).length).length;
    if (S.tag.startsWith("t:") && !m.has(S.tag.slice(2))) S.tag = "all";
    const sel = $("#tagSel");
    sel.innerHTML = [["all", "タグ：すべて"], ["none", `タグなし（${none}）`], ...voc.map(([t, n]) => ["t:" + t, `${t}（${n}）`])].map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
    sel.value = S.tag; sel.title = kind ? `「${kind}」の中のタグ` : "タグで絞り込む";
    $("#taglist").innerHTML = tagVocab(false).map(([t]) => `<option value="${esc(t)}"></option>`).join("");
  }
  const tagPending = new Set(); let tagBusy = false;
  function queueTagSync(iid) { if (!secret?.gas) return; tagPending.add(iid); if (!tagBusy) tagWorker(); }
  async function tagWorker() {                     // Notion への書き込みは、1件ずつ順に(GAS は立て続けに送ると失敗しやすい)
    tagBusy = true; let ok = 0, failed = false;
    while (tagPending.size) {
      const iid = [...tagPending][0]; tagPending.delete(iid);
      const o = RS.tags[iid], it = S.byId.get(iid); if (!o || !it || !secret?.gas) continue;
      try { await gas("saveTags", { pageId: iid, tags: o.v, source: it.src }, { waits: [400, 1500] }); if (RS.tags[iid] === o) { o.pend = false; ok++; } }
      catch (e) { failed = true; tagPending.clear(); toast("Notion のタグへの反映に失敗しました（この端末と同期先には保存済みです。あとで自動でやり直します）。\n" + e.message, 7000); break; }
      if (tagPending.size && ok % 5 === 0) toast(`Notion のタグに反映中…（残り ${tagPending.size} 件）`, 2500);
    }
    tagBusy = false;
    if (ok) { saveRS(); if (!failed && ok > 3) toast(`Notion のタグへの反映が終わりました（${ok} 件）`, 2500); }
  }
  function resumeTagSync() { if (!secret?.gas) return; for (const [iid, o] of Object.entries(RS.tags)) if (o.pend && S.byId.has(iid)) tagPending.add(iid); if (tagPending.size && !tagBusy) tagWorker(); }
  function setTags(iid, list) {
    const it = S.byId.get(iid); if (!it) return;
    const v = [...new Set(list.map(cleanTag).filter(Boolean))];
    if (sameSet(v, effTags(it))) return;
    RS.tags[iid] = { v, at: Date.now(), pend: !!secret.gas };
    saveRS(true); queueTagSync(iid);
  }
  const tagEditor = it => `<div class="tagedit" data-tid="${it.id}"><div class="chips">${effTags(it).map(t => `<button type="button" class="chip on" data-tagdel="${esc(t)}" title="外す">${esc(t)} ×</button>`).join("") || '<span class="recline">タグはまだありません。</span>'}</div><div class="tagadd"><input list="taglist" placeholder="タグを追加（Enter）" maxlength="100" autocomplete="off"><button type="button" class="tb" data-tagadd="1">追加</button></div></div>`;
  function refreshTagUI(iid, keepFocus) {
    drawTagMenu();
    const it = S.byId.get(iid); if (!it) return;
    $$(`[data-tid="${iid}"]`).forEach(box => { box.outerHTML = tagEditor(it); });
    const cnt = $('#detail summary .cnt[data-tcnt]'); if (cnt) cnt.textContent = effTags(it).length;
    if (keepFocus) $(`[data-tid="${iid}"] input`)?.focus();
    if (S.tag !== "all") drawList();
  }
  function addTagFrom(iid, inp) {
    const t = cleanTag(inp.value), it = S.byId.get(iid); if (!t || !it) return;
    setTags(iid, [...effTags(it), t]); refreshTagUI(iid, true);
  }
  document.addEventListener("click", e => {
    const del = e.target.closest("[data-tagdel]");
    if (del) { const iid = del.closest("[data-tid]").dataset.tid, it = S.byId.get(iid); setTags(iid, effTags(it).filter(t => t !== del.dataset.tagdel)); refreshTagUI(iid); return; }
    const add = e.target.closest("[data-tagadd]"); if (add) { const box = add.closest("[data-tid]"); addTagFrom(box.dataset.tid, box.querySelector("input")); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-tid] input")) { e.preventDefault(); addTagFrom(e.target.closest("[data-tid]").dataset.tid, e.target); }
  });
  $("#tagSel").addEventListener("change", e => { S.tag = e.target.value; closeDetail(); drawList(); });
  $("#tagBtn").addEventListener("click", e => { const it = S.byId.get(S.cur); if (it) showPop(`<h3>タグ</h3>${tagEditor(it)}`, e.currentTarget); });

  /* ---------- 種別(1件につき1つだけ。既定は「動画」「Web記事」。記録と同じ暗号化同期) ---------- */
  const DEF_KIND = x => x.src === "web" ? "Web記事" : "動画";
  const kindOf = x => { const o = RS.kinds[x.id]; return (o && o.v) ? o.v : DEF_KIND(x); };
  const cleanKind = t => String(t ?? "").replace(/\s+/g, " ").trim().slice(0, 30);
  function kindVocab() {                                   // 使われている種別。「動画」「Web記事」は、いつも先頭
    const m = new Map([["動画", 0], ["Web記事", 0]]);
    for (const x of S.items) { if (isDup(x)) continue; const k = kindOf(x); m.set(k, (m.get(k) || 0) + 1); }
    const rest = [...m.entries()].filter(([k]) => k !== "動画" && k !== "Web記事").sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
    return [["動画", m.get("動画")], ["Web記事", m.get("Web記事")], ...rest];
  }
  function updateKindBtn() { const it = S.byId.get(S.cur), b = $("#kindBtn"); if (b) b.textContent = it ? "種別：" + kindOf(it) : "種別"; }
  function setKind(iid, v) {                               // 排他: 前の値は置き換わる(既定と同じ値にしたら、もとに戻す)
    const it = S.byId.get(iid); if (!it) return;
    v = cleanKind(v); if (!v || v === kindOf(it)) return;
    RS.kinds[iid] = { v: v === DEF_KIND(it) ? null : v, at: Date.now() };
    saveRS(true);
  }
  function resetKind(iid) { if (!RS.kinds[iid]?.v) return; RS.kinds[iid] = { v: null, at: Date.now() }; saveRS(true); }
  const kindEditor = it => {
    const cur = kindOf(it);
    return `<div class="kindedit" data-kid="${it.id}"><div class="chips" role="radiogroup" aria-label="種別">${kindVocab().map(([k]) => `<button type="button" class="chip${k === cur ? " on" : ""}" role="radio" aria-checked="${k === cur}" data-kindset="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <div class="tagadd"><input list="kindlist" placeholder="新しい種別（Enter）" maxlength="30" autocomplete="off"><button type="button" class="tb" data-kindadd="1">追加</button></div>
      ${RS.kinds[it.id]?.v ? `<button type="button" class="lnk" data-kindreset="1">もとに戻す（${esc(DEF_KIND(it))}）</button>` : ""}</div>`;
  };
  function refreshKindUI(iid, keepFocus) {
    const it = S.byId.get(iid); if (!it) return;
    drawKind(); drawList();
    $$(`[data-kid="${iid}"]`).forEach(box => { box.outerHTML = kindEditor(it); });
    const cnt = $("#detail summary .cnt[data-kcnt]"); if (cnt) cnt.textContent = kindOf(it);
    if (S.cur === iid && S.curBundle) renderBundle(it, S.curBundle, true);
    if (keepFocus) $(`[data-kid="${iid}"] input`)?.focus();
  }
  function addKindFrom(iid, inp) { const v = cleanKind(inp.value); if (!v) return; setKind(iid, v); inp.value = ""; refreshKindUI(iid, true); }
  document.addEventListener("click", e => {
    const set = e.target.closest("[data-kindset]"); if (set) { const iid = set.closest("[data-kid]").dataset.kid; setKind(iid, set.dataset.kindset); refreshKindUI(iid); return; }
    const add = e.target.closest("[data-kindadd]"); if (add) { const box = add.closest("[data-kid]"); addKindFrom(box.dataset.kid, box.querySelector("input")); return; }
    const rs = e.target.closest("[data-kindreset]"); if (rs) { const iid = rs.closest("[data-kid]").dataset.kid; resetKind(iid); refreshKindUI(iid); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-kid] input")) { e.preventDefault(); addKindFrom(e.target.closest("[data-kid]").dataset.kid, e.target); }
  });
  $("#kindBtn").addEventListener("click", e => { const it = S.byId.get(S.cur); if (it) showPop(`<h3>種別</h3><p class="recline">1つだけ選べます。選び直すと、前の種別は外れます。</p>${kindEditor(it)}`, e.currentTarget); });
  function bulkKindDialog() {
    const ids = [...S.tsel].filter(id => S.byId.has(id)); if (!ids.length) return;
    let chosen = "";
    const names = () => [...new Set([...kindVocab().map(k => k[0]), ...(chosen ? [chosen] : [])])];
    const chips = () => names().map(k => `<button type="button" class="chip${k === chosen ? " sel" : ""}" role="radio" aria-checked="${k === chosen}" data-bk2="${esc(k)}">${esc(k)}</button>`).join("");
    popOpen("種別を設定", `<p>${ids.length} 件の種別を、<b>1つ</b>に決めます（いまの種別は置き換わります）。</p>
      <div class="chips" id="bkChips" role="radiogroup" style="margin-bottom:10px">${chips()}</div>
      <div class="tagadd" style="margin-bottom:10px"><input id="bkIn" list="kindlist" placeholder="新しい種別（Enter）" maxlength="30" autocomplete="off"><button class="tb" id="bkAdd">追加</button></div>
      <div class="acts"><button class="tb main" id="bkGo">設定する</button></div><div class="msg" id="bkMsg"></div>`, () => {
      const redraw = () => { $("#bkChips").innerHTML = chips(); };
      $("#bkChips").onclick = e => { const c = e.target.closest("[data-bk2]"); if (!c) return; chosen = c.dataset.bk2; redraw(); };
      const addNew = () => { const v = cleanKind($("#bkIn").value); if (v) { chosen = v; $("#bkIn").value = ""; redraw(); } };
      $("#bkAdd").onclick = addNew; $("#bkIn").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } };
      $("#bkGo").onclick = () => {
        if ($("#bkIn").value.trim()) addNew();
        if (!chosen) { $("#bkMsg").textContent = "種別を1つ選んでください。"; return; }
        ids.forEach(id => setKind(id, chosen));
        popClose(); drawKind(); drawList(); updateBulk(); updateKindBtn();
        toast(`${ids.length} 件の種別を「${chosen}」にしました。`, 3000);
      };
    });
  }

  /* ---------- 選択モード(まとめてタグ付け) ---------- */
  function updateBulk() {
    const b = $("#bulkbar"); b.hidden = !S.selMode; if (!S.selMode) return;
    const n = S.tsel.size;
    b.innerHTML = `<span class="bn">${n} 件を選択</span><button class="tb" data-bk="all">すべて選ぶ</button><button class="tb" data-bk="none" ${n ? "" : "disabled"}>解除</button><button class="tb main" data-bk="add" ${n ? "" : "disabled"}>タグを付ける</button><button class="tb" data-bk="rm" ${n ? "" : "disabled"}>タグを外す</button><button class="tb" data-bk="kind" ${n ? "" : "disabled"}>種別を設定</button>`;
  }
  function setSelMode(on) {
    S.selMode = !!on; S.tsel.clear(); if (S.selMode) closeDetail();
    $("#selBtn").setAttribute("aria-pressed", String(S.selMode)); $("#selBtn").textContent = S.selMode ? "選択を終える" : "選択";
    drawList(); updateBulk();
  }
  $("#selBtn").addEventListener("click", () => setSelMode(!S.selMode));
  $("#bulkbar").addEventListener("click", e => {
    const b = e.target.closest("[data-bk]"); if (!b) return;
    if (b.dataset.bk === "all") { visible().forEach(x => S.tsel.add(x.id)); drawList(); updateBulk(); return; }
    if (b.dataset.bk === "none") { S.tsel.clear(); drawList(); updateBulk(); return; }
    if (b.dataset.bk === "kind") return bulkKindDialog();
    bulkTagDialog(b.dataset.bk);
  });
  function bulkTagDialog(mode) {
    const ids = [...S.tsel].filter(id => S.byId.has(id)); if (!ids.length) return;
    const add = mode === "add", chosen = new Set();
    let base;
    if (add) base = tagVocab(false).slice(0, 60);
    else { const m = new Map(); ids.forEach(id => effTags(S.byId.get(id)).forEach(t => m.set(t, (m.get(t) || 0) + 1))); base = [...m.entries()].sort((a, b) => b[1] - a[1]); }
    const names = () => [...new Set([...base.map(b => b[0]), ...chosen])];
    const count = Object.fromEntries(base);
    const chips = () => names().map(t => `<button type="button" class="chip${chosen.has(t) ? " sel" : ""}" data-bt="${esc(t)}">${esc(t)}${!add ? `（${count[t] || 0}）` : ""}</button>`).join("") || `<span class="recline">${add ? "まだタグがありません。下に入力してください。" : "選んだ動画には、タグが付いていません。"}</span>`;
    popOpen(add ? "タグを付ける" : "タグを外す", `<p>${ids.length} 件に${add ? "付ける" : "付いている"}タグを選びます。</p>
      <div class="chips" id="btChips" style="margin-bottom:10px">${chips()}</div>
      ${add ? `<div class="tagadd" style="margin-bottom:10px"><input id="btIn" list="taglist" placeholder="新しいタグ（Enter で追加）" maxlength="100" autocomplete="off"><button class="tb" id="btAdd">追加</button></div>` : ""}
      <div class="acts"><button class="tb main" id="btGo">${add ? "付ける" : "外す"}</button></div><div class="msg" id="btMsg"></div>`, () => {
      const redraw = () => { $("#btChips").innerHTML = chips(); };
      $("#btChips").onclick = e => { const c = e.target.closest("[data-bt]"); if (!c) return; chosen.has(c.dataset.bt) ? chosen.delete(c.dataset.bt) : chosen.add(c.dataset.bt); redraw(); };
      const addNew = () => { const t = cleanTag($("#btIn").value); if (t) { chosen.add(t); $("#btIn").value = ""; redraw(); } };
      if (add) { $("#btAdd").onclick = addNew; $("#btIn").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } }; }
      $("#btGo").onclick = () => {
        if (add && $("#btIn").value.trim()) addNew();
        if (!chosen.size) { $("#btMsg").textContent = "タグを選んでください。"; return; }
        for (const id of ids) { const it = S.byId.get(id), cur = effTags(it); setTags(id, add ? [...cur, ...chosen] : cur.filter(t => !chosen.has(t))); }
        popClose(); drawTagMenu(); drawList(); updateBulk();
        toast(`${ids.length} 件のタグを${add ? "付けました" : "外しました"}。${secret.gas ? "Notion にも順に反映します。" : ""}`, 3500);
      };
    });
  }

  /* ---------- 画面内プレーヤー(動かせる・大きさを変えられる) ---------- */
  const VP_HEAD = 34;
  function vpApply() {
    const vp = $("#vp"); if (vp.hidden) return;
    const vw = innerWidth, vh = innerHeight, maxW = Math.max(220, Math.min(vw - 16, (vh - 16 - VP_HEAD) * 16 / 9));
    S.vp.w = Math.round(Math.min(Math.max(+S.vp.w || 480, 220), maxW));
    const w = S.vp.w, h = VP_HEAD + Math.round(w * 9 / 16);
    let x = S.vp.x, y = S.vp.y;
    if (x == null || y == null) { x = vw - w - 16; y = vh - h - 16; }
    S.vp.x = Math.round(Math.min(Math.max(0, x), Math.max(0, vw - w))); S.vp.y = Math.round(Math.min(Math.max(0, y), Math.max(0, vh - h)));
    vp.style.width = w + "px"; vp.style.left = S.vp.x + "px"; vp.style.top = S.vp.y + "px";
  }
  function playAt(id, sec, title) {
    const body = $("#vpBody"), f = document.createElement("iframe");
    f.title = "動画"; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true; f.referrerPolicy = "strict-origin-when-cross-origin";
    f.src = `https://www.youtube-nocookie.com/embed/${id}?start=${sec | 0}&autoplay=1&rel=0&playsinline=1`;
    body.innerHTML = ""; body.appendChild(f);
    $("#vpTitle").textContent = title || ""; $("#vpExt").href = `https://www.youtube.com/watch?v=${id}&t=${sec | 0}s`;
    S.vpId = id; $("#vp").hidden = false; vpApply();
  }
  function vpClose() { $("#vp").hidden = true; $("#vpBody").innerHTML = ""; S.vpId = ""; }
  function dragger(handle, onMove) {
    handle.addEventListener("pointerdown", e => {
      if (e.button) return;
      const vp = $("#vp"); if (handle === $("#vpHead") && e.target.closest("button,a")) return;
      const sx = e.clientX, sy = e.clientY, ox = vp.offsetLeft, oy = vp.offsetTop, ow = vp.offsetWidth;
      vp.classList.add("dragging"); handle.setPointerCapture(e.pointerId); e.preventDefault();
      const mv = ev => { onMove({ dx: ev.clientX - sx, dy: ev.clientY - sy, ox, oy, ow }); vpApply(); };
      const up = () => { vp.classList.remove("dragging"); handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); handle.removeEventListener("pointercancel", up); savePrefs(); };
      handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);
    });
  }
  dragger($("#vpHead"), d => { S.vp.x = d.ox + d.dx; S.vp.y = d.oy + d.dy; });
  dragger($("#vpGrip"), d => { S.vp.w = d.ow + d.dx; });
  $("#vp").addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (b) { S.vp.w = +b.dataset.w; vpApply(); savePrefs(); } });
  $("#vpX").addEventListener("click", vpClose);
  window.addEventListener("resize", vpApply);
  document.addEventListener("click", e => {                // 時刻リンクは別タブではなく、この画面のプレーヤーで再生する
    const a = e.target.closest("a.ts[data-v]"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault(); playAt(a.dataset.v, +a.dataset.sec || 0, S.byId.get(S.cur)?.t || "");
  });

  /* ---------- 操作 ---------- */
  $$(".bar .hb[data-m]").forEach(b => b.addEventListener("click", () => mode(b.dataset.m)));
  $("#kind").addEventListener("change", e => { S.kind = e.target.value; drawTagMenu(); closeDetail(); drawList(); });
  $("#q").addEventListener("input", e => { S.q = e.target.value; if (S.mode !== "library") mode("library"); closeDetail(); drawList(); });
  $("#reload").addEventListener("click", async () => {
    setStatus("web-archive から読み直しています…");
    try { S.at = ""; S.notes = null; S.night = null; S.bundles.clear(); await loadJson("index.json.age", (o, how) => o ? applyIndex(o, how) : applyIndex(null, how), true); await refreshSync(true); }
    catch (e) { setStatus(e.message); }
  });
  $("#list").addEventListener("click", e => {
    if (e.target.closest("[data-fav]")) return;                  // ★ は、開かずに、お気に入りの切り替え(#shelf 側で処理)
    const b = e.target.closest(".item"); if (!b) return;
    if (S.selMode) { const id = b.dataset.id; S.tsel.has(id) ? S.tsel.delete(id) : S.tsel.add(id); b.classList.toggle("sel", S.tsel.has(id)); updateBulk(); return; }   // 選択モードでは、開かずに選ぶ
    openItem(b.dataset.id);
  });
  $("#tile").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.tile = b.dataset.t; $$("#tile button").forEach(x => x.classList.toggle("on", x === b)); savePrefs(); drawList(); });
  $("#sort").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.sort = b.dataset.s; $$("#sort button").forEach(x => x.classList.toggle("on", x === b)); savePrefs(); drawList(); });
  $("#wideBtn").addEventListener("click", e => {          // 一覧を画面いっぱいに広げる(本文は隠れる)
    S.wide = !S.wide; $("#app").classList.toggle("wide", S.wide);
    e.currentTarget.setAttribute("aria-pressed", String(S.wide)); e.currentTarget.textContent = S.wide ? "全画面を終了" : "全画面";
    if (!S.wide && !mobile()) setReading(false);
    drawList(); updateTabbar();
  });
  $("#shelf").addEventListener("click", e => {             // 「目次・記録 ›」と、詳細ペインの操作
    const more = e.target.closest("[data-gb]"); if (more) return openDetail(more.dataset.gb);
    if (e.target.closest("[data-gback]")) return closeDetail();
    const t = e.target.closest("[data-toc]"); if (t) return gotoToc(t.dataset.iid, t.dataset.toc);
    const gn = e.target.closest("[data-gonote]"); if (gn) return goNote(...gn.dataset.gonote.split("|"));
    const bs = e.target.closest("[data-bst]"); if (bs) { setReadState(bs.dataset.bid, bs.dataset.bst); return; }
    const fv = e.target.closest("[data-fav]"); if (fv) toggleFav(fv.dataset.fav);
  });
  $("#wm").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setWm(b.dataset.wm === "v"); });
  $("#fsUp").addEventListener("click", () => setFs(1));
  $("#fsDown").addEventListener("click", () => setFs(-1));
  $("#openSrc").addEventListener("click", () => {
    const b = S.curBundle; if (!b?.url) return;
    const id = ytId(b.url);
    if (!id) { window.open(b.url, "_blank", "noopener,noreferrer"); return; }
    if (!$("#vp").hidden && S.vpId === id) { toast("すでに再生画面で開いています"); return; }
    playAt(id, 0, b.title || S.byId.get(S.cur)?.t || "");
  });
  document.addEventListener("click", e => {
    const o = e.target.closest("[data-open]"); if (!o) return;
    mode("library"); if (S.kind !== "all" && S.byId.get(o.dataset.open) && kindOf(S.byId.get(o.dataset.open)) !== S.kind.slice(2)) { S.kind = "all"; $("#kind").value = "all"; drawList(); }
    openItem(o.dataset.open);
  });
  // 変換管理
  $("#mfilter").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.mfilter = b.dataset.f; drawManage(); });
  $("#mq").addEventListener("input", e => { S.mq = e.target.value; drawManage(); });
  $("#mlist").addEventListener("change", e => { const c = e.target.closest("input[type=checkbox]"); if (!c) return; c.checked ? S.sel.add(c.dataset.id) : S.sel.delete(c.dataset.id); drawManage(); });
  $("#mlist").addEventListener("click", e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "open") { mode("library"); openItem(b.dataset.id); }
    else if (b.dataset.act === "del") deleteDups([b.dataset.id]);
    else runSummaries([b.dataset.id]);
  });
  $("#mGo").addEventListener("click", () => runSummaries([...S.sel]));
  $("#mAiSet").addEventListener("click", aiDialog);
  $("#mDel").addEventListener("click", () => deleteDups([...S.sel]));
  $("#mAll").addEventListener("click", () => {
    const ids = S.items.filter(x => grp(x) === "queue").map(x => x.id);
    const all = ids.length && ids.every(id => S.sel.has(id));
    ids.forEach(id => all ? S.sel.delete(id) : S.sel.add(id)); drawManage();
  });
  /* ---------- Claude.ai の要約ページ(アーティファクト)を開く ---------- */
  const okClaudeUrl = u => { try { const o = new URL(u); return o.protocol === "https:" && (o.hostname === "claude.ai" || o.hostname.endsWith(".claude.ai")); } catch { return false; } };
  const claudeUrl = () => { const u = RS.misc.claudeUrl?.v; return u && okClaudeUrl(u) ? u : ""; };
  function openClaude(u) {
    const n = S.items.filter(x => grp(x) === "queue").length;
    window.open(u, "_blank", "noopener,noreferrer");
    $("#mnote").textContent = `Claude.ai の要約ページを開きました（要約待ち ${n} 件）。動画を選んで要約すると、Notion に書き込まれます。終わったら、Mac の書き出しのあと、ここの「↻ 更新」で反映します。`;
  }
  function claudeUrlDialog() {
    const cur = claudeUrl();
    popOpen("Claude.ai の要約ページ", `<p>Claude.ai で公開した、アーティファクト「ClipStock 要約待ちを要約する」のリンクを貼ってください（<code>https://claude.ai/artifact/…</code>）。一度保存すると、次からは、ボタンを押すだけで開きます。</p>
      <label class="f"><span>リンク</span><input id="cuIn" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://claude.ai/artifact/…" value="${esc(cur)}"></label>
      <div class="acts" style="flex-wrap:wrap"><button class="tb main" id="cuGo">保存して開く</button><button class="tb" id="cuChat">チャットで開く（ページなし）</button>${cur ? '<button class="tb" id="cuDel">保存を消す</button>' : ""}</div>
      <div class="msg" id="cuMsg"></div>
      <p class="recline">リンクは、暗号化して記録に保存され、ほかの端末にも出ます。claude.ai のリンクだけ使えます。</p>`, () => {
      $("#cuGo").onclick = () => {
        const u = $("#cuIn").value.trim();
        if (!okClaudeUrl(u)) { $("#cuMsg").textContent = "claude.ai の https のリンクだけ使えます。"; return; }
        RS.misc.claudeUrl = { v: u, at: Date.now() }; saveRS(true); popClose(); openClaude(u);
      };
      $("#cuChat").onclick = () => {                       // ページが無いとき: チャットで、スキルに頼む
        const q = "ClipStock の要約待ちを一覧で表示して、私が選んだものを ClipStock の形式で要約して Notion に書き込んでください。";
        popClose(); window.open("https://claude.ai/new?q=" + encodeURIComponent(q), "_blank", "noopener,noreferrer");
        $("#mnote").textContent = "Claude.ai のチャットを開きました。スキル clipstock-summarizer が、要約待ちを一覧にします。";
      };
      if ($("#cuDel")) $("#cuDel").onclick = () => { RS.misc.claudeUrl = { v: null, at: Date.now() }; saveRS(true); popClose(); $("#mnote").textContent = "保存したリンクを消しました。"; };
      $("#cuIn").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#cuGo").click(); } };
      $("#cuIn").focus();
    });
  }
  $("#mClaudeAll").addEventListener("click", () => { const u = claudeUrl(); if (u) openClaude(u); else claudeUrlDialog(); });
  $("#mClaudeSet").addEventListener("click", claudeUrlDialog);
  // ノート
  $("#notes").addEventListener("click", e => {
    const f = e.target.closest("[data-nf]"); if (f) { nKind = f.dataset.nf; drawNotes(); return; }
    const gn = e.target.closest("[data-gonote]"); if (gn) goNote(...gn.dataset.gonote.split("|"));
  });
  $("#notes").addEventListener("input", e => { if (e.target.id === "nq") { nq = e.target.value; drawNotes(); const i = $("#nq"); i.focus(); i.setSelectionRange(nq.length, nq.length); } });
  window.addEventListener("beforeunload", stopTrack);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  showGate();
})();

</script>
</body>
</html>

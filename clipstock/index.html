<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://cdn.jsdelivr.net; style-src 'unsafe-inline' 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com https://script.google.com https://script.googleusercontent.com https://*.ngrok-free.dev https://*.ngrok-free.app https://*.ngrok.dev https://*.ngrok.app https://*.ngrok.io https://*.trycloudflare.com http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src data: blob: 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>ClipStock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ClipStock">
<meta name="theme-color" content="#26335a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f7f5; --sheet:#ffffff; --ink:#1c222c; --muted:#5f6878; --line:#d5dae1;
  --cloth:#26335a; --cloth-ink:#e9ecf4; --foil:#a9822a; --foil-text:#7d5f17; --foil-soft:rgba(169,130,42,.14);
  --desk:#e8e5dd; --danger:#a33a2b; --ok:#2f6b4f;
  --m1:#FAC775; --m2:#9FE1CB; --m3:#F4C0D1;
  --hl-y:rgba(243,206,90,.45); --hl-b:rgba(120,172,226,.38); --hl-p:rgba(236,150,172,.38);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14171c; --sheet:#1b1f26; --ink:#e4e7ec; --muted:#a0a8b5; --line:#323844;
    --cloth:#121a30; --cloth-ink:#dfe4f0; --foil:#d7b25a; --foil-text:#d7b25a; --foil-soft:rgba(215,178,90,.16);
    --desk:#101318; --danger:#e08a7b; --ok:#7fbf9c; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%; overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%}
body{position:fixed; inset:0; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--paper); color:var(--ink);
  font:15px/1.6 var(--sans); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--cloth)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foil); outline-offset:2px}

/* 鍵の画面 */
.gate{flex:1; overflow:auto; background:var(--cloth); color:var(--cloth-ink); display:flex; align-items:flex-start; justify-content:center; padding:40px 18px}
.gate-card{width:min(440px,100%); background:var(--paper); color:var(--ink); border-radius:10px; padding:26px 26px 22px; box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gate h1{font-family:var(--serif); font-size:28px; letter-spacing:.1em; margin:0 0 4px}
.gate .lead{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.7}
.f{display:block; margin-bottom:13px}
.f span{display:block; font-size:13px; font-weight:500; margin-bottom:4px}
.f small{display:block; font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.6}
.f input,.f textarea{width:100%; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:9px 10px; font-size:14px}
.f textarea{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; min-height:60px; resize:vertical}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.go{width:100%; border:0; border-radius:6px; background:var(--cloth); color:var(--cloth-ink); padding:12px; font-size:15px; font-weight:500; margin-top:6px}
.go[disabled]{opacity:.6; cursor:default}
.msg{min-height:1.3em; font-size:12.5px; margin-top:9px; color:var(--danger)}
.go.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); margin-top:8px}
.go.ghost:hover{border-color:var(--foil)}
.link{border:0; background:none; padding:0; color:var(--muted); font-size:12.5px; text-decoration:underline; margin-top:14px; display:block}

/* 上の帯 */
.bar{background:var(--cloth); color:var(--cloth-ink); display:flex; align-items:center; gap:8px; padding:9px 12px; flex-wrap:wrap}
.brand{font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:.06em; white-space:nowrap}
.kind{border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:var(--cloth-ink); border-radius:6px; min-height:32px; padding:0 8px; font-size:13px}
.kind option{color:#1c222c}
.search{flex:1; min-width:130px; max-width:300px; margin-left:auto; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:var(--cloth-ink); border-radius:6px; padding:6px 10px; font-size:13.5px}
.search::placeholder{color:rgba(233,236,244,.65)}
.hb{border:1px solid rgba(255,255,255,.35); background:transparent; color:var(--cloth-ink); border-radius:6px; min-height:32px; padding:0 11px; font-size:13px; white-space:nowrap}
.hb[aria-pressed="true"]{background:var(--cloth-ink); color:var(--cloth); border-color:var(--cloth-ink)}
.navs{display:flex; gap:8px; align-items:center}
.status{font-size:12px; color:var(--muted); padding:4px 14px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* 一覧と本文 */
.grid{flex:1; min-height:0; display:grid; grid-template-columns:min(44vw,600px) minmax(0,1fr)}
.grid.wide{grid-template-columns:minmax(0,1fr)}
.grid.wide #viewer{display:none}
#shelf{border-right:1px solid var(--line); overflow:auto; background:var(--paper); overscroll-behavior:contain}
.grid.wide #shelf{border-right:0}
.shelf-tools{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:6px; padding:7px 12px; background:var(--paper); border-bottom:1px solid var(--line); flex-wrap:wrap}
.shelf-tools .sp{flex:1}
.count{font-size:12px; color:var(--muted); white-space:nowrap}
.tb{border:1px solid var(--line); background:var(--sheet); border-radius:6px; min-height:32px; min-width:34px; padding:0 10px; font-size:13px; display:inline-flex; align-items:center; gap:5px; text-decoration:none; color:inherit}
.tb:hover{border-color:var(--foil)}
.tb.main{background:var(--cloth); color:var(--cloth-ink); border-color:var(--cloth)}
.tb[disabled]{opacity:.45; cursor:default}
.seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{border:0; background:var(--sheet); min-height:32px; padding:0 11px; font-size:13px; color:var(--muted)}
.seg button.on{background:var(--cloth); color:var(--cloth-ink)}
.seg .n{font-size:11px; margin-left:5px; opacity:.8}

.list{display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile,124px),1fr)); gap:9px; padding:10px; align-content:start}
.grid.wide .list{--tile:150px; gap:12px; padding:14px}
.cell{min-width:0; display:flex; flex-direction:column; gap:1px; content-visibility:auto; contain-intrinsic-size:auto 160px}
.item{display:block; width:100%; text-align:left; border:0; background:none; padding:0; border-radius:6px}
.more{border:0; background:none; padding:3px 0 6px; text-align:left; font-size:12px; color:var(--foil-text); cursor:pointer}
.more:hover{text-decoration:underline}
.item:hover .thumb{outline:2px solid var(--foil)}
.item.on .thumb{outline:3px solid var(--foil)}
.thumb{width:100%; aspect-ratio:16/9; border-radius:3px 6px 6px 3px; background:hsl(var(--h,220) 28% 34%); position:relative; overflow:hidden; display:block;
  box-shadow:inset 5px 0 0 rgba(0,0,0,.18), 0 5px 12px rgba(20,24,40,.18); transition:transform .15s, box-shadow .15s}
.item:hover .thumb{transform:translateY(-2px); box-shadow:inset 5px 0 0 rgba(0,0,0,.18), 0 9px 18px rgba(20,24,40,.24)}
.item.on .thumb{outline:3px solid var(--foil); outline-offset:2px}
.thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.thumb .ph{position:absolute; inset:0; padding:8% 9% 8% 11%; display:flex; align-items:center; color:#f4efe2; font-family:var(--serif)}
.thumb .ph b{font-weight:600; font-size:12px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.thumb .len{position:absolute; right:4px; bottom:3px; background:rgba(0,0,0,.66); color:#fff; font-size:10.5px; padding:0 5px; border-radius:2px; font-variant-numeric:tabular-nums}
.thumb .web{position:absolute; left:6px; top:5px; background:var(--cloth); color:var(--cloth-ink); font-size:10px; padding:0 6px; border-radius:9px}
.thumb .nb,.newb{display:inline-block; font-size:10.5px; font-weight:600; color:#fff; background:#c0573f; border-radius:9px; padding:0 7px; line-height:1.7}
.thumb .nb{position:absolute; right:6px; top:5px; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.newb{margin-left:8px; vertical-align:2px}
.it-title{font-family:var(--serif); font-weight:600; font-size:var(--tt,12.5px); line-height:1.45; margin-top:7px; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.it-meta{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grid.wide .list{--tt:13.5px}
.empty{color:var(--muted); font-size:13.5px; padding:36px 20px; line-height:1.9; max-width:30em; margin:auto; text-align:center}

#viewer{display:flex; flex-direction:column; min-height:0; overflow:hidden; background:var(--desk)}
.rtools{display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--paper); flex-wrap:wrap}
.rtools .sp{flex:1}
.vhead{padding:9px 18px 0; background:var(--desk)}
.vhead h1{font-family:var(--serif); font-weight:600; font-size:19px; margin:0; line-height:1.5}
.vhead .sub{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.vhead .jump{display:flex; gap:4px; margin-left:auto}
.vhead .jump button{border:1px solid var(--line); background:var(--sheet); border-radius:999px; font-size:11.5px; padding:0 9px; min-height:24px; color:var(--muted)}
.stage{flex:1; min-height:0; overflow:hidden; padding:12px 18px 16px; background:var(--desk)}
.sheet{background:var(--sheet); border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 24px rgba(20,24,40,.10); padding:20px 26px; height:100%; overflow-x:auto; overflow-y:hidden}
.flow{height:100%; font-size:var(--fs,15px); line-height:1.95; column-fill:auto; column-width:calc(var(--fs,15px) * 21); column-gap:46px; column-rule:1px dashed var(--line)}
.h .sheet{overflow-x:hidden; overflow-y:auto}
.h .flow{height:auto; column-width:auto; column-gap:0; column-rule:none; max-width:46em; margin:0 auto; padding-bottom:2em}
.v .sheet{writing-mode:vertical-rl; font-family:var(--serif); width:100%; max-width:100%}
.v .flow{line-height:1.85; column-width:auto; column-gap:0; column-rule:none; height:100%; width:auto}
.flow h2{font-family:var(--serif); font-size:1.08em; margin:0 0 .6em; padding-bottom:.2em; border-bottom:1px solid var(--line); break-after:avoid; color:var(--foil-text); letter-spacing:.06em; break-inside:avoid}
.flow h2:not(:first-child){margin-top:1.5em}
.flow h3{font-size:1em; margin:.9em 0 .3em; break-after:avoid; font-weight:700}
.flow p{margin:0 0 .75em; text-align:justify}
.flow ul{margin:0 0 .85em; padding:0; list-style:none}
.flow li{margin:0 0 .35em; padding-left:1.1em; text-indent:-1.1em}
.flow li::before{content:"・"; display:inline-block; width:1.1em; text-indent:0}
.flow .star{color:var(--foil); font-size:.85em; margin-right:.3em}
.flow .hid{font-size:.75em; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-right:.4em}
.v .flow h2{border-bottom:0; border-right:1px solid var(--line); padding:0 .2em 0 0; margin:0 0 0 .9em}
.v .flow h2:not(:first-child){margin-top:0; margin-right:1.8em}
.v .flow h3{margin:0 0 0 .2em}
.v .flow p{margin:0 0 0 .75em}
.v .flow ul{margin:0 0 0 .85em}
.v .flow li{padding-left:0; text-indent:0; padding-top:1.1em; text-indent:0; margin:0 0 0 .35em}
.v .flow li::before{position:absolute; margin-top:-1.1em}
.v .flow li{position:relative}
.m1,.m2,.m3{border-radius:2px; padding:0 1px}
.m1{background:var(--m1); color:#1c222c} .m2{background:var(--m2); color:#1c222c} .m3{background:var(--m3); color:#1c222c}
.ts{border:1px solid var(--line); background:var(--paper); color:var(--foil-text); border-radius:4px; font-size:.78em; padding:0 5px; margin:0 .2em; font-variant-numeric:tabular-nums; text-decoration:none; white-space:nowrap; writing-mode:horizontal-tb; display:inline-block; line-height:1.6; text-indent:0}
a.ts:hover{border-color:var(--foil)}
.v .ts{writing-mode:vertical-rl; text-orientation:sideways; padding:2px 0; margin:.3em 0; font-size:.7em; line-height:1.35}

/* 下のパネル */
.panel{flex:1; min-height:0; overflow:auto; padding:16px 18px 48px; background:var(--paper)}
.panel h2{font-family:var(--serif); font-size:17px; margin:0 0 4px}
.panel .lead{font-size:12.5px; color:var(--muted); margin:0 0 14px}
.mtools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.mtools .sp{flex:1}
.mtools input[type="search"]{border:1px solid var(--line); background:var(--sheet); border-radius:6px; min-height:32px; padding:0 10px; font-size:13px; min-width:150px}
.mlist{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--sheet)}
.row{display:grid; grid-template-columns:28px 76px minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-size:13.5px; line-height:1.45}
.row .m{font-size:11.5px; color:var(--muted)}
.row .thumb{width:76px}
.badge{font-size:11.5px; border-radius:999px; padding:2px 9px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.badge.todo{color:var(--danger); border-color:var(--danger)}
.badge.queue{color:var(--foil-text); border-color:var(--foil)}
.badge.done{color:var(--ok); border-color:var(--ok)}
.mnote{font-size:12.5px; color:var(--muted); margin:-4px 0 12px; min-height:1.4em; white-space:pre-wrap}
.cards{display:grid; gap:10px}
.ncard{border:1px solid var(--line); border-radius:8px; background:var(--sheet); padding:12px 14px}
.ncard .h{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500; flex-wrap:wrap}
.ncard .m{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.7}
.ncard.warn{border-color:var(--danger)}
.note{border:1px solid var(--line); border-left:4px solid var(--foil); border-radius:6px; background:var(--sheet); padding:9px 12px; margin-bottom:8px}
.note.c1{border-left-color:var(--m1)} .note.c2{border-left-color:var(--m2)} .note.c3{border-left-color:var(--m3)}
.note .q{font-size:13.5px; line-height:1.7}
.note .m{font-size:11.5px; color:var(--muted); margin-top:3px}
.ngroup{margin:14px 0 6px; font-family:var(--serif); font-size:14px; display:flex; gap:8px; align-items:center}
.ngroup button{border:0; background:none; padding:0; font:inherit; text-align:left; text-decoration:underline; text-decoration-color:var(--line)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px}
.stat{border:1px solid var(--line); border-radius:8px; background:var(--sheet); padding:12px 14px}
.stat .n{font-family:var(--serif); font-size:26px; line-height:1.2}
.stat .l{font-size:11.5px; color:var(--muted)}
.bars{display:flex; align-items:flex-end; gap:5px; height:110px; padding:10px 12px 4px; border:1px solid var(--line); border-radius:8px; background:var(--sheet)}
.bars div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; font-size:9.5px; color:var(--muted)}
.bars i{display:block; width:100%; background:var(--foil-soft); border-top:3px solid var(--foil); border-radius:2px 2px 0 0; min-height:2px}

/* ダイアログ */
.pop{position:fixed; inset:0; z-index:30; background:rgba(10,14,24,.55); display:flex; align-items:center; justify-content:center; padding:18px}
.pop-card{width:min(720px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); border-radius:10px; box-shadow:0 24px 60px rgba(0,0,0,.4); overflow:hidden}
.pop-head{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line)}
.pop-head h3{margin:0; font-family:var(--serif); font-size:15px; flex:1}
.pop-body{padding:14px 16px; overflow:auto; font-size:14px; line-height:1.8}
.pop-body textarea{width:100%; min-height:150px; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:9px 10px; font-size:13px}
.pop-body .acts{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0}
.pop-body h4{margin:14px 0 4px; font-size:13px}
details.mm{margin:2px 0 2px 1.1em}
details.mm>summary{cursor:pointer; list-style:none; margin-left:-1.1em}
details.mm>summary::before{content:"▸ "; color:var(--muted)}
details.mm[open]>summary::before{content:"▾ "}
.mm-leaf{margin:2px 0 2px 0}
.tline{margin:0 0 .5em}


/* マーカー */
.flow .m1,.flow .m2,.flow .m3{cursor:pointer}
.flow ::selection{background:rgba(169,130,42,.35)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; background:#1c222c; color:#fff;
  padding:9px 14px; border-radius:8px; font-size:13px; max-width:min(92vw,520px); box-shadow:0 8px 24px rgba(0,0,0,.35); white-space:pre-wrap}

/* 画面内プレーヤー(動かせる・大きさを変えられる) */
.vp{position:fixed; z-index:40; display:flex; flex-direction:column; background:#000; border-radius:10px; overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.18)}
.vp-head{display:flex; align-items:center; gap:4px; padding:4px 6px 4px 10px; background:var(--cloth); color:var(--cloth-ink); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; min-height:34px}
.vp.dragging .vp-head{cursor:grabbing}
.vp-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px}
.vp-b{border:1px solid rgba(255,255,255,.3); background:transparent; color:var(--cloth-ink); border-radius:5px; min-width:28px; min-height:26px; padding:0 7px; font-size:12px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center}
.vp-body{position:relative; width:100%; aspect-ratio:16/9; background:#000}
.vp-body iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.vp.dragging iframe{pointer-events:none}
.vp-grip{position:absolute; right:0; bottom:0; width:26px; height:26px; cursor:nwse-resize; touch-action:none; z-index:2;
  background:linear-gradient(135deg,transparent 52%,rgba(255,255,255,.85) 52%,rgba(255,255,255,.85) 60%,transparent 60%,transparent 72%,rgba(255,255,255,.85) 72%,rgba(255,255,255,.85) 80%,transparent 80%)}
.racts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.nhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.nhead h2{margin:0}
.pop-body select{width:100%; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:8px 9px; font-size:14px; margin-bottom:6px}
#viewer{position:relative}


/* 本文のフォント(表示の設定で変える。既定はしっぽり明朝) */
.flow{font-family:var(--bodyfont,var(--serif))}
.v .sheet{font-family:var(--bodyfont,var(--serif))}

/* マーカー(書庫と同じ) */
mark.hl{color:inherit; border-radius:2px; padding:0; cursor:pointer}
mark.hl.c-y{background:var(--hl-y)} mark.hl.c-b{background:var(--hl-b)} mark.hl.c-p{background:var(--hl-p)}
mark.hl.memo{text-decoration:underline dotted var(--foil) 2px; text-underline-offset:3px}
mark.hl.flash{outline:2px solid var(--foil); outline-offset:1px}
.sw{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; flex:none}
.sw.c-y{background:#e6bf3f} .sw.c-b{background:#6fa6dc} .sw.c-p{background:#e58fa6} .sw.c-g{background:#7fbf9c}
.seltool{position:fixed; z-index:44; display:flex; gap:2px; background:#232838; color:#fff; border-radius:9px; padding:4px; box-shadow:0 8px 22px rgba(0,0,0,.3)}
.seltool button{border:0; background:none; color:#fff; padding:7px 10px; border-radius:6px; font-size:13px; white-space:nowrap; display:flex; align-items:center}
.seltool button:hover{background:rgba(255,255,255,.12)}
.nq{white-space:pre-wrap; font-family:var(--serif); font-size:14px; line-height:1.7; background:var(--sheet); border-left:3px solid var(--foil); padding:6px 10px; margin:0; max-height:9em; overflow:auto}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{border:1px solid var(--line); background:var(--sheet); color:var(--muted); border-radius:14px; min-height:26px; padding:0 10px; font-size:12px; display:inline-flex; align-items:center}
.chip.on{border-color:var(--foil); color:var(--ink); background:var(--foil-soft)}

/* 小窓(目次・記録・表示の設定・マーカー・メモ) */
#bpop{position:fixed; z-index:45; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 40px rgba(20,24,40,.3);
  padding:14px 16px 14px; width:min(440px,calc(100vw - 16px)); max-height:min(78vh,640px); overflow:auto}
#bpop h3{font-family:var(--serif); font-size:15px; margin:0 26px 8px 0}
#bpop .x{position:absolute; right:8px; top:6px; border:0; background:none; font-size:22px; line-height:1; color:var(--muted); cursor:pointer; padding:2px 8px}
#bpop textarea{width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:14px/1.6 var(--sans); background:var(--sheet); color:var(--ink); resize:vertical}
.optrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.optrow.col{flex-direction:column; align-items:stretch} .optrow:last-child{border-bottom:0}
.optrow .lb{flex:1} .optrow .note{display:block; font-size:11.5px; color:var(--muted)}
.fontpick{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; margin-top:6px; max-height:46vh; overflow:auto}
.fontpick button{text-align:left; border:1px solid var(--line); background:var(--sheet); color:var(--ink); border-radius:6px; padding:7px 9px; cursor:pointer; font:inherit}
.fontpick button[aria-pressed="true"]{border-color:var(--foil); box-shadow:0 0 0 1px var(--foil) inset; background:var(--foil-soft)}
.fontpick .fn{display:block; font-size:12px; color:var(--muted); font-family:var(--sans)}
.fontpick .fs{display:block; font-size:17px; line-height:1.5; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rc{margin-left:4px; font-size:11px; color:var(--foil-text)}
.rc:empty{display:none}

/* 目次・記録(一覧の横の詳細ペイン / 小窓の中) */
.sdetail{padding:10px 0 40px}
.sback{border:0; background:none; padding:6px 14px; color:var(--foil-text); font-size:13px; cursor:pointer}
.shead{display:grid; grid-template-columns:96px minmax(0,1fr); gap:12px; align-items:start; padding:6px 14px 12px}
.shead .it-title{display:block; font-size:15px; margin:2px 0 4px; -webkit-line-clamp:4}
.shead .it-meta{white-space:normal}
details.acc{border-top:1px solid var(--line); margin:0 14px}
details.acc > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; padding:9px 4px; font-size:13px; font-weight:600}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::before{content:"›"; display:inline-block; width:1em; color:var(--muted); transition:transform .15s}
details.acc[open] > summary::before{transform:rotate(90deg)}
details.acc > summary .cnt{font-weight:400; color:var(--muted); font-size:12px}
.accbody{padding:0 2px 12px}
.tocb{display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:0; background:none; padding:8px 6px; border-radius:6px; font-size:14px; cursor:pointer}
.tocb:hover{background:var(--foil-soft)} .tocb .sub{margin-left:auto; font-size:11.5px; color:var(--muted)}
.tocb[disabled]{opacity:.45; cursor:default}
.lnk{border:0; background:none; padding:4px 0; color:var(--foil-text); font-size:13px; text-decoration:underline; cursor:pointer}
.nmini{border-left:4px solid var(--foil); background:var(--sheet); border-radius:6px; padding:7px 10px; margin:6px 0; cursor:pointer; font-size:13px; line-height:1.6}
.nmini{white-space:pre-line}
.nmini .nm{font-size:11.5px; color:var(--muted); margin-top:2px}
.f select{width:100%; border:1px solid var(--line); background:var(--sheet); color:inherit; border-radius:6px; padding:9px 10px; font-size:14px}
.msg.ok{color:var(--muted)}
.recline{font-size:12.5px; color:var(--muted); margin:2px 0 8px; line-height:1.8}
.finb{display:inline-block; font-size:10.5px; color:#fff; background:var(--ok); border-radius:9px; padding:0 7px; margin-left:6px}

/* 文字起こし・マインドマップの表示 */
.sheet.mmwrap{padding:0; overflow:hidden !important; writing-mode:horizontal-tb !important}
.mmwrap .mm-host{width:100%; height:100%; min-height:300px}
.tr .tline{margin:0 0 .6em; text-indent:0}

/* 全画面(書庫と同じ): 上の帯・一覧を隠して、本文だけを広く */
body.full .bar, body.full #shelf, body.full .status{display:none !important}
body.full .grid{grid-template-columns:minmax(0,1fr)}
body.full #viewer{display:flex !important}


/* 選択モード(まとめてタグ付け)・タグ・重複 */
.thumb .chk{position:absolute; left:6px; top:5px; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.85); color:transparent; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; font-size:13px; font-weight:700}
.selmode .thumb .chk{display:flex}
.selmode .web{left:34px}
.item.sel .thumb .chk{background:var(--cloth); color:#fff; border-color:#fff}
.item.sel .thumb{outline:3px solid var(--foil); outline-offset:2px}
.selmode .more{visibility:hidden}
#shelf{display:flex; flex-direction:column}
#shelf > .list{flex:1 0 auto}
#shelf > #detail{flex:1 0 auto}
#bulkbar{margin-top:auto; position:sticky; bottom:0; z-index:3; display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 12px; background:var(--cloth); color:var(--cloth-ink); box-shadow:0 -6px 18px rgba(20,24,40,.2)}
#bulkbar[hidden]{display:none}
#bulkbar .bn{font-size:13px; margin-right:auto}
#bulkbar .tb{background:transparent; color:var(--cloth-ink); border-color:rgba(255,255,255,.4)}
#bulkbar .tb.main{background:var(--cloth-ink); color:var(--cloth)}
#bulkbar .tb[disabled]{opacity:.4}
.tagedit .chips{margin-bottom:8px}
.kindedit .chips{margin-bottom:8px}
.kindedit .lnk{margin-top:8px}
.tagadd{display:flex; gap:6px; align-items:center}
.tagadd input{flex:1; min-width:0; border:1px solid var(--line); background:var(--sheet); border-radius:6px; min-height:32px; padding:0 10px; font-size:13px}
.chip.sel{border-color:var(--foil); background:var(--foil-soft); color:var(--ink)}
.badge.dup{color:var(--danger); border-color:var(--danger)}
.tb.danger{color:var(--danger); border-color:var(--danger)}
.row .dupnote{color:var(--danger)}

body:has(#bulkbar:not([hidden])) .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* 一覧を全画面にしたまま、サムネイルを押すと詳細(本文)を全画面に切り替える。「‹ 一覧へ」で一覧に戻る */
.grid.wide.reading{grid-template-columns:minmax(0,1fr)}
.grid.wide.reading #shelf{display:none}
.grid.wide.reading #viewer{display:flex}
/* スマホ: 読むときは、上の帯・題名・ボタンを隠し、画面を押すとスライドで出す(書庫と同じ) */
body.imm{padding-bottom:0}
body.imm::before{background:var(--desk)}
body.imm .bar{position:fixed; top:0; left:0; right:0; z-index:30; padding-top:calc(env(safe-area-inset-top,0px) + 8px); transition:transform .25s ease, box-shadow .25s}
body.imm .status{display:none}
body.imm .vtop{position:fixed; left:0; right:0; top:var(--barh,0px); z-index:29; background:var(--paper); border-bottom:1px solid var(--line); transition:transform .25s ease, box-shadow .25s}
body.imm:not(.chrome) .bar{transform:translateY(-100%)}
body.imm:not(.chrome) .vtop{transform:translateY(calc(-100% - var(--barh,0px) - 12px))}
body.imm.chrome .bar, body.imm.chrome .vtop{box-shadow:0 6px 18px rgba(20,24,40,.2)}
body.imm #viewer, body.imm .stage{background:var(--desk)}
body.imm .stage{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}

/* 下部のタブ(一覧・本文): スマホと、一覧を全画面にしたとき。書庫と同じ */
.tabbar{display:none; background:var(--paper); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1; border:0; background:none; padding:11px 0; font-size:13.5px; color:var(--muted); cursor:pointer}
.tabbar button.on{color:var(--ink); font-weight:600; box-shadow:inset 0 2px 0 var(--foil)}
@media (max-width:820px){ .tabbar:not([hidden]){display:flex} }
body:has(.grid.wide) .tabbar:not([hidden]){display:flex}
body.full .tabbar{display:none !important}
body.imm .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; transition:transform .25s ease}
body.imm:not(.chrome) .tabbar{transform:translateY(100%)}
/* 状態(すべて・未読・読書中・読了・お気に入り)の絞り込み */
.fbar{display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line)}
.fbar .chip{cursor:pointer}
/* お気に入り */
.thumb .fav{position:absolute; left:5px; bottom:4px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.5); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; cursor:pointer; z-index:2}
.thumb .fav.on{color:#f3d36b}
.selmode .thumb .fav{display:none}
.sdet-actions{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px}
.stbtns{display:flex; flex-wrap:wrap; gap:6px}
#favBtn[aria-pressed="true"]{color:var(--foil-text); border-color:var(--foil); background:var(--foil-soft)}

@media (max-width:820px){
  #wideBtn{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  #viewer{display:none}
  .grid.reading #shelf{display:none}
  .grid.reading #viewer{display:flex}
  .bar{padding:8px 10px; row-gap:6px}
  .search{max-width:none; order:9; flex-basis:100%; margin-left:0}
  .navs{order:5; flex-basis:100%; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .navs::-webkit-scrollbar{display:none}
  .navs .hb{flex:none}
  .rtools{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .rtools::-webkit-scrollbar{display:none}
  .rtools .tb,.rtools .seg{flex:none}
  .rtools .sp{display:none}
  body:has(.grid.reading) .search{display:none}
  .row{grid-template-columns:28px 64px minmax(0,1fr); row-gap:6px}
  .row .badge,.row .tb,.row .racts{grid-column:3}
  .racts{justify-content:flex-start}
    .stage{padding:8px 8px 10px}
  .sheet{padding:14px 14px}
}
</style>
</head>
<body>

<section class="gate" id="gate">
  <div class="gate-card">
    <h1>ClipStock</h1>
    <p class="lead" id="gateLead"></p>

    <form id="setupForm" hidden autocomplete="off">
      <div class="two">
        <label class="f"><span>GitHubのユーザー名</span><input id="owner" required value="ymatsuda2026-cloud" autocapitalize="off" spellcheck="false"></label>
        <label class="f"><span>リポジトリ</span><input id="repo" required value="web-archive" autocapitalize="off" spellcheck="false"></label>
      </div>
      <label class="f"><span>アクセストークン</span><input id="token" type="password" required autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
        <small>web-archive だけを対象に、Contents を「Read and write」にした fine-grained トークン（マーカー・メモ・タグの同期に書き込みます）。</small></label>
      <label class="f"><span>復号の鍵</span><textarea id="agekey" required autocapitalize="off" spellcheck="false" placeholder="AGE-SECRET-KEY-1…"></textarea>
        <small>Mac の ~/.config/clipstock/key.txt にある AGE-SECRET-KEY- で始まる1行。</small></label>
      <label class="f"><span>要約の窓口（GAS のURL）</span><input id="gas" type="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
        <small>要約・メモの保存はここに依頼します。空欄なら閲覧だけ使えます。</small></label>
      <label class="f"><span>窓口の共有トークン</span><input id="gastoken" type="password" autocapitalize="off" spellcheck="false" placeholder="ACCESS_TOKEN と同じ値">
        <small>GAS のスクリプトプロパティ ACCESS_TOKEN と同じもの。</small></label>
      <div class="two">
        <label class="f"><span>合言葉</span><input id="pass1" type="password" required minlength="8" autocomplete="new-password"></label>
        <label class="f"><span>合言葉（確認）</span><input id="pass2" type="password" required minlength="8" autocomplete="new-password"></label>
      </div>
      <small style="display:block;font-size:11.5px;color:var(--muted);margin:-4px 0 10px;line-height:1.6">ここに入れたものは合言葉で暗号化して、この端末のブラウザにだけ保存します。開くたびに合言葉を聞きます。</small>
      <button class="go" id="setupGo">確認して保存</button>
    </form>

    <form id="unlockForm" hidden>
      <label class="f"><span>合言葉</span><input id="pass" type="password" required autocomplete="current-password"></label>
      <button class="go" id="unlockGo">開く</button>
      <button type="button" class="go ghost" id="bioGo" hidden>Face ID・Touch ID で開く</button>
      <button type="button" class="link" id="reset">この端末の設定を消して、最初から設定する</button>
    </form>
    <div class="msg" id="gateMsg" role="alert"></div>
  </div>
</section>

<header class="bar" id="bar" hidden>
  <div class="brand">ClipStock</div>
  <select class="kind" id="kind" aria-label="種別"></select>
  <select class="kind" id="tagSel" aria-label="タグ"></select>
  <input class="search" id="q" type="search" placeholder="タイトル・要約から探す" aria-label="タイトル・要約から探す" enterkeyhint="search">
  <nav class="navs">
  <button class="hb" data-m="library" aria-pressed="true">一覧</button>
  <button class="hb" data-m="notes" aria-pressed="false">ノート</button>
  <button class="hb" data-m="stats" aria-pressed="false">記録</button>
  <button class="hb" data-m="night" aria-pressed="false">夜間処理</button>
  <button class="hb" data-m="manage" aria-pressed="false">変換管理</button>
  <button class="hb" id="reload" title="web-archive から読み直す">↻ 更新</button>
  <button class="hb" id="lock" title="鍵をかける">🔒 鍵</button>
  </nav>
</header>
<div class="status" id="status" aria-live="polite" hidden></div>

<main class="grid" id="app" hidden>
  <nav id="shelf" aria-label="一覧">
    <div class="shelf-tools">
      <span class="count" id="count"></span>
      <span class="sp"></span>
      <div class="seg" id="tile" role="group" aria-label="サムネイルの大きさ">
        <button data-t="s" title="小さく（たくさん）">小</button>
        <button data-t="m" class="on">中</button>
        <button data-t="l" title="大きく">大</button>
      </div>
      <div class="seg" id="sort" role="group" aria-label="並び">
        <button data-s="new" class="on">新しい順</button>
        <button data-s="old">古い順</button>
      </div>
      <button class="tb" id="selBtn" aria-pressed="false" title="いくつか選んで、まとめてタグを付ける">選択</button>
      <button class="tb" id="wideBtn" aria-pressed="false" title="一覧を画面いっぱいにします。サムネイルを押すと、詳細も全画面で開きます">全画面</button>
    </div>
    <div class="fbar" id="fbar" role="group" aria-label="状態で絞り込む"></div>
    <div class="list" id="list"></div>
    <div id="detail" hidden></div>
    <div id="bulkbar" hidden></div>
  </nav>

  <article id="viewer" class="h">
    <div class="vtop" id="vtop">
    <div class="rtools" id="rtools">
      <div class="seg" id="wm" role="group" aria-label="組み方">
        <button data-wm="v">縦書き</button>
        <button data-wm="h" class="on">横書き</button>
      </div>
      <button class="tb" id="fsDown" aria-label="文字を小さく">A−</button>
      <button class="tb" id="fsUp" aria-label="文字を大きく">A＋</button>
      <button class="tb" id="favBtn" aria-pressed="false" title="お気に入り">☆ お気に入り</button>
      <button class="tb" id="tocBtn" aria-haspopup="dialog">目次</button>
      <button class="tb" id="recBtn" aria-haspopup="dialog" title="この動画のマーカーとメモ">記録<span class="rc" id="recN"></span></button>
      <button class="tb" id="kindBtn" aria-haspopup="dialog" title="この動画の種別（1つだけ選べます）">種別</button>
      <button class="tb" id="tagBtn" aria-haspopup="dialog" title="この動画のタグ">タグ</button>
      <button class="tb" id="openSrc">▶ 動画を開く</button>
      <span class="sp"></span>
      <button class="tb" id="optBtn" aria-label="表示の設定" aria-haspopup="dialog">⚙ 表示</button>
      <button class="tb" id="fullBtn"><span id="fullLbl">全画面</span></button>
    </div>
    <div class="vhead" id="vhead"></div>
    </div>
    <div class="stage" id="stage"></div>
  </article>
</main>
<nav class="tabbar" id="tabbar" hidden aria-label="一覧と本文"><button type="button" data-m="list" class="on">一覧</button><button type="button" data-m="reader">本文</button></nav>

<section class="panel" id="notes" hidden aria-label="ノート"></section>
<section class="panel" id="stats" hidden aria-label="記録"></section>
<section class="panel" id="night" hidden aria-label="夜間処理"></section>
<section class="panel" id="manage" hidden aria-label="変換管理">
  <h2>変換管理</h2>
  <p class="lead">要約はここで行います。要約が終わったものだけが一覧に並びます。依頼は要約の窓口（GAS）へ送られ、Notion への書き戻しもそちらで行います。</p>
  <div class="mtools">
    <div class="seg" id="mfilter" role="group" aria-label="状態で絞り込む">
      <button data-f="all" class="on">すべて<span class="n"></span></button>
      <button data-f="todo">未変換<span class="n"></span></button>
      <button data-f="queue">要約待ち<span class="n"></span></button>
      <button data-f="done">要約済み<span class="n"></span></button>
      <button data-f="dup">重複<span class="n"></span></button>
    </div>
    <input type="search" id="mq" placeholder="タイトルで探す" aria-label="タイトルで探す">
    <span class="sp"></span>
    <button class="tb" id="mAll">要約待ちを全選択</button>
    <button class="tb main" id="mGo" disabled>選択を要約する</button><button class="tb" id="mAiSet" title="「選択を要約する」で使う AI と API キー" aria-haspopup="dialog">要約AI</button>
    <button class="tb" id="mClaudeAll">Claude.ai で要約待ちを変換</button><button class="tb" id="mClaudeSet" title="開く先（アーティファクトの URL）を変える" aria-label="開く先を変える">⚙</button>
    <button class="tb" id="mDel" disabled title="重複したものを、Notion のゴミ箱へ移す">重複を削除</button>
  </div>
  <p class="mnote" id="mnote"></p>
  <div class="mlist" id="mlist"></div>
</section>

<datalist id="taglist"></datalist>
<datalist id="kindlist"></datalist>
<div class="pop" id="pop" hidden role="dialog" aria-modal="true"><div class="pop-card" id="popCard"></div></div>

<div class="vp" id="vp" hidden role="dialog" aria-label="動画プレーヤー">
  <div class="vp-head" id="vpHead">
    <span class="vp-title" id="vpTitle"></span>
    <button class="vp-b" data-w="320" title="小さく">小</button>
    <button class="vp-b" data-w="480" title="ふつう">中</button>
    <button class="vp-b" data-w="720" title="大きく">大</button>
    <a class="vp-b" id="vpExt" target="_blank" rel="noopener noreferrer" title="YouTubeで開く">↗</a>
    <button class="vp-b" id="vpX" title="閉じる">✕</button>
  </div>
  <div class="vp-body" id="vpBody"></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const mobile = () => matchMedia("(max-width:820px)").matches;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  const BIO = "clipstock.bio", VAULT = "clipstock.vault", SEEN = "clipstock.seen", PREFS = "clipstock.prefs", REC = "clipstock.records", OVL = "clipstock.overlay", LAST = "clipstock.last";
  const DATA = "clipstock-data";

  let secret = null, K = null, dec = null;   // 鍵を開けている間だけメモリに置く
  const S = {
    items: [], byId: new Map(), at: "", notes: null, night: null,
    cur: null, kind: "all", q: "", sort: "new", tile: "m", vert: false, fs: 15, wide: false, full: false, view: "main", detail: null,
    mode: "library", mfilter: "all", mq: "", sel: new Set(), run: {}, ovl: {}, bundles: new Map(), busy: false,
    vp: { w: 480, x: null, y: null }, vpId: "", prevSeen: 0
  };
  S.dup = new Map(); S.tag = "all"; S.kind = "all"; S.selMode = false; S.tsel = new Set(); S.sf = ls.get("clipstock.sf", "all");
  { const p = ls.get(PREFS, {}); for (const k of ["tile", "vert", "fs", "sort", "vp"]) if (p[k] !== undefined) S[k] = p[k]; }
  const savePrefs = () => ls.set(PREFS, { tile: S.tile, vert: S.vert, fs: S.fs, sort: S.sort, vp: S.vp });
  let toastTimer = 0;
  function toast(t, ms = 3800) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms); }

  /* ---------- 小さな道具 ---------- */
  const pad = n => String(n).padStart(2, "0");
  const md = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()}`; };
  const mdhm = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dur = s => { s = Math.floor(s || 0); if (!s) return ""; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
  const srcLabel = s => s === "web" ? "Web" : "動画";
  const MARK = /<m([123])>([\s\S]*?)<\/m\1>/g;
  const plain = raw => String(raw ?? "").replace(MARK, (_, __, t) => t);
  const setStatus = t => { const el = $("#status"); S.statusBase = t || ""; el.textContent = S.statusBase + (S.statusBase && S.syncAt ? ` ・ 記録の同期 ${pad(new Date(S.syncAt).getHours())}:${pad(new Date(S.syncAt).getMinutes())}` : ""); el.hidden = !t; };
  const group = st => st === "要約済み" ? "done" : st === "完了" ? "queue" : "todo";
  const hashHue = s => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };

  /* ---------- 合言葉で鍵とトークンを守る ---------- */
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u => { let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

      { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function sealWith(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj))));
    return { iv: b64(iv), ct: b64(ct) };
  }

    return JSON.parse(td.decode(pt));
  }
  const vaultGet = () => ls.get(VAULT, null);
  const msg = t => { $("#gateMsg").textContent = t || ""; };

  /* ---------- GitHub(web-archive)から取得して復号 ---------- */
  const ghUrl = path => `https://api.github.com/repos/${encodeURIComponent(secret.owner)}/${encodeURIComponent(secret.repo)}/contents/${path}`;
  async function ghRaw(path, sec = secret) {
    const url = `https://api.github.com/repos/${encodeURIComponent(sec.owner)}/${encodeURIComponent(sec.repo)}/contents/${path}`;
    let r;
    try {
      r = await fetch(url, { cache: "no-store", headers: { Authorization: "Bearer " + sec.token, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" } });
    } catch { throw new Error(navigator.onLine ? "GitHub につながりませんでした。" : "オフラインです。まだ端末に保存されていないものは開けません。"); }
    if (r.status === 401) throw new Error("トークンが無効か、期限切れです。");
    if (r.status === 403) throw new Error("GitHub の利用制限に達しました。しばらく待ってください。");
    if (r.status === 404) { const e = new Error("見つかりません: " + path); e.code = 404; throw e; }
    if (!r.ok) throw new Error("GitHub " + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }
  const open = (bytes, as = "text") => dec.decrypt(bytes, as);
  async function cGet(url) { try { const c = await caches.open(DATA); const r = await c.match(url); return r ? new Uint8Array(await r.arrayBuffer()) : null; } catch { return null; } }
  async function cPut(url, bytes) { try { const c = await caches.open(DATA); await c.put(url, new Response(bytes)); } catch {} }

  /** 保存分をすぐ見せ、裏で最新に入れ替える(一覧・ノート・夜間処理) */
  async function loadJson(path, on, force = false) {
    const url = ghUrl(path);
    let shown = false;
    if (!force) {
      const hit = await cGet(url);
      if (hit) { try { on(JSON.parse(await open(hit)), "cache"); shown = true; } catch {} }
    }
    try {
      const fresh = await ghRaw(path);
      await cPut(url, fresh);
      on(JSON.parse(await open(fresh)), "net");
    } catch (e) {
      if (!shown) throw e;
      on(null, "offline", e);
    }
  }

  /* ---------- 要約の窓口(GAS) ---------- */
  /* GAS は気まぐれに失敗する(リダイレクト先が 404 になり、ブラウザには CORS エラーに見える。Notion への保存自体は成功していることもある)。
     旧画面と同じ対策: ①1本ずつ・間隔を空けて送る ②URL に毎回違う値を付ける ③通信が失敗したときだけやり直す。
     どの保存も「同じ値を書き直すだけ」なので、やり直しても副作用は増えない。 */

  const GAS_GAP = DEV.gap ?? 2500, GAS_WAITS = DEV.waits ?? [400, 1500, 4000, 10000, 20000];

      try { return await task(); } finally { gasLast = Date.now(); }
    });
    gasTail = run.catch(() => {}); return run;
  }
  async function gasPost(url, body) {
    const target = url + (url.includes("?") ? "&" : "?") + "r=" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const r = await fetch(target, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", body });
    if (!r.ok) throw new Error("GAS HTTP " + r.status);
    return r.json();
  }
  async function gasRetry(url, body, waits) {
    for (let i = 0; ; i++) {
      try { return await gasPost(url, body); }
      catch (e) {
        if (i >= waits.length) throw e;
        if (i >= 1) toast(`窓口への通信をやり直しています（${i + 1}/${waits.length + 1}）…`, 3000);
        await sleep(waits[i]);
      }
    }
  }
  async function gas(action, payload, opt = {}) {
    if (!secret.gas) throw new Error("要約の窓口（GAS）が未登録です。設定をやり直して URL を入れてください。");
    const body = JSON.stringify({ action, token: secret.gastoken, ...payload });
    let j;
    try { j = await gasEnqueue(() => gasRetry(secret.gas, body, opt.waits ?? GAS_WAITS)); }
    catch { throw new Error("要約の窓口（GAS）につながりませんでした。\n・デプロイの「アクセスできるユーザー」が「全員」か\n・登録した URL が、最新のデプロイの /exec か\n・デプロイした版に doPost があるか（窓口の URL をブラウザで開くと、JSON で分かります。SETUP の「診断」）"); }

      if (/unknown action/i.test(er)) throw new Error("要約の窓口（GAS）に Summarize.gs が入っていないか、デプロイが古いままです。SETUP の「3. GAS」を確認してください。");
      if (/メモ/.test(er) && /(property|プロパティ|exist|見つか)/i.test(er)) throw new Error("Notion の動画DBに「メモ」という名前のテキスト列がありません。\nDB に「メモ」（テキスト）列を追加してください。");
      throw new Error(er || "窓口でエラーが起きました。");
    }
    return j.data;
  }

  /* ---------- 要約の手元反映(次の書き出しまでの橋渡し) ---------- */
  async function saveOvl() { try { ls.set(OVL, await sealWith(K, S.ovl)); } catch {} }
  async function loadOvl() { try { const v = ls.get(OVL, null); S.ovl = v ? await unsealWith(K, v) : {}; } catch { S.ovl = {}; } }
  function mergeOverlay() {
    let dirty = false; const now = Date.now();
    for (const [id, o] of Object.entries(S.ovl)) {
      if (now - (o.t || 0) > 14 * 864e5) { delete S.ovl[id]; dirty = true; continue; }   // 14日たったら手元の分は捨てる
      const it = S.byId.get(id);
      if (!it) continue;
      if (o.g) {   // 要約の直後だけ「要約済み」に見せる。書き出しが追いついたら外す
        const caughtUp = it.st === "要約済み" && it.g && Date.parse(it.g) >= Date.parse(o.g) - 1000;
        if (caughtUp) { delete o.g; delete o.model; dirty = true; }
        else { it.st = "要約済み"; it.g = o.g; if (o.detail?.summary) it.s = plain(o.detail.summary).replace(/\n/g, " ").slice(0, 240); }
      }
      if (!o.g && o.memo === undefined && !Object.keys(o.detail || {}).length) { delete S.ovl[id]; dirty = true; }
    }
    if (dirty) saveOvl();
  }
  function applySummary(id, r) {
    const d = r.detail || {};
    const prev = S.ovl[id] || {};
    S.ovl[id] = { ...prev, g: r.generatedAt, t: Date.now(), model: r.model, detail: { ...(prev.detail || {}), ...d } };
    const it = S.byId.get(id);
    if (it) {
      it.st = "要約済み"; it.g = r.generatedAt;
      if (d.summary) it.s = plain(d.summary).replace(/\n/g, " ").slice(0, 240);
      it.h = { ...(it.h || {}), sm: 1, ...(d.mindmap ? { mm: 1 } : {}), ...(d.fields ? { fl: 1 } : {}), ...(d.apply ? { ap: 1 } : {}), ...(d.ideas ? { id: 1 } : {}) };
    }
    saveOvl();
  }

  /* ---------- 一覧 ---------- */
  function applyIndex(obj, how, err) {
    if (how === "offline") { setStatus(`オフライン（この端末の保存から表示）・要約済み ${doneCount()} 件`); return; }
    const fresh = obj.at !== S.at || !S.items.length;
    S.at = obj.at;
    if (fresh) {
      const ids = new Set((obj.items || []).map(x => x.id));
      for (const [id, o] of Object.entries(RS.gone)) if (!ids.has(id) && Date.parse(obj.at) > (o.at || 0)) delete RS.gone[id];   // 書き出しに反映されたら、削除の印は外す
      S.items = (obj.items || []).filter(x => !RS.gone[x.id]);
      S.byId = new Map(S.items.map(x => [x.id, x]));
      mergeOverlay(); computeDups();
      drawKind(); drawAll();
    }
    setStatus(`${how === "cache" ? "この端末の保存から表示・裏で更新を確認中…" : "最新"} ・ 要約済み ${doneCount()} 件 ・ 取得 ${mdhm(obj.at)}`);
  }
  const doneCount = () => S.items.filter(x => x.st === "要約済み" && !isDup(x)).length;

  function drawKind() {
    const done = S.items.filter(x => x.st === "要約済み" && !isDup(x));
    const m = new Map(); done.forEach(x => { const k = kindOf(x); m.set(k, (m.get(k) || 0) + 1); });
    if (S.kind !== "all" && !m.has(S.kind.slice(2))) S.kind = "all";
    const rk = k => k === "動画" ? 0 : k === "Web記事" ? 1 : 2;
    const ord = [...m.entries()].sort((a, b) => rk(a[0]) - rk(b[0]) || b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
    const sel = $("#kind");
    sel.innerHTML = [["all", `種別：すべて（${done.length}）`], ...ord.map(([k, n]) => ["k:" + k, `${k}（${n}）`])].map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
    sel.value = S.kind;
    $("#kindlist").innerHTML = kindVocab().map(([k]) => `<option value="${esc(k)}"></option>`).join("");
    updateKindBtn(); drawTagMenu();
  }
  /** 種別・タグ・検索で絞ったもの(状態の絞り込みの前)。状態のチップの件数は、これで数える */
  function baseItems() {
    const q = S.q.trim().toLowerCase();
    return S.items.filter(x => x.st === "要約済み" && !isDup(x) && (S.kind === "all" || kindOf(x) === S.kind.slice(2)) && tagOk(x)
      && (!q || (x.t || "").toLowerCase().includes(q) || (x.s || "").toLowerCase().includes(q)));
  }
  const stateFilterOk = x => S.sf === "all" || (S.sf === "fav" ? !!RS.fav[x.id]?.v : stateOf(x.id) === S.sf);
  function visible() {
    const a = baseItems().filter(stateFilterOk);
    a.sort((p, r) => S.sort === "old" ? (p.c || "").localeCompare(r.c || "") : (r.c || "").localeCompare(p.c || ""));
    return a;
  }
  function drawFbar() {
    const base = baseItems(), cnt = { all: base.length, unread: 0, reading: 0, done: 0, fav: 0 };
    for (const x of base) { cnt[stateOf(x.id)]++; if (RS.fav[x.id]?.v) cnt.fav++; }
    $("#fbar").innerHTML = [["all", "すべて"], ["unread", "未読"], ["reading", "読書中"], ["done", "読了"], ["fav", "★ お気に入り"]]
      .map(([k, l]) => `<button type="button" class="chip${S.sf === k ? " on" : ""}" data-sf="${k}">${l} ${cnt[k]}</button>`).join("");
  }
  const TILE = { s: 92, m: 124, l: 172 };
  /* 新着(書庫と同じ考え方): 前回開いたあとに要約されて、まだ開いていないもの */
  const isNew = x => !!S.prevSeen && !RS.pos[x.id] && Date.parse(x.g || x.e || "") > S.prevSeen;
  function thumbBox(x, withChk) {
    // サムネイルがあるものは、背景に文字を入れない(読み込めなかったときだけ、題名を出す)
    return `<span class="thumb" style="--h:${hashHue(x.t)}" data-tt="${esc(x.t)}" ${x.th ? `data-th="${x.id}"` : ""}>${x.th ? "" : `<span class="ph" aria-hidden="true"><b>${esc(x.t)}</b></span>`}${x.src === "web" ? '<span class="web">Web</span>' : ""}${isNew(x) ? '<span class="nb">新着</span>' : ""}${x.d ? `<span class="len">${dur(x.d)}</span>` : ""}${withChk ? '<span class="chk">✓</span>' + favStar(x.id) : ""}</span>`;
  }
  function drawList() {
    const rows = visible(); drawFbar();
    $("#count").textContent = `${rows.length} 件`;
    const list = $("#list");
    list.style.setProperty("--tile", Math.round(TILE[S.tile] * (S.wide ? 1.25 : 1)) + "px");
    list.style.setProperty("--tt", ({ s: 11.5, m: 12.5, l: 13.5 }[S.tile] + (S.wide ? 0.5 : 0)) + "px");
    list.classList.toggle("selmode", S.selMode);
    list.innerHTML = rows.map(x => `<div class="cell"><button class="item${x.id === S.cur ? " on" : ""}${S.tsel.has(x.id) ? " sel" : ""}" data-id="${x.id}">${thumbBox(x, true)}<span class="it-title" title="${esc(x.t)}">${esc(x.t)}</span><span class="it-meta">${esc(kindOf(x))} ・ ${md(x.c)}${stLabel(x.id)}</span></button><button class="more" data-gb="${x.id}">目次・記録 ›</button></div>`).join("")
      || `<p class="empty" style="grid-column:1/-1">${S.items.length ? "条件に合う動画がありません。<br>要約していないものは「変換管理」から要約してください。" : "まだ書き出されたデータがありません。"}</p>`;
    hydrateThumbs(list);
  }
  function drawAll() { computeDups(); drawList(); if (S.mode === "manage") drawManage(); }

  /* サムネ: 見えたものだけ取りに行く(同時6本・Blob URL をメモリに保持) */
  const thumbs = new Map();
  let active = 0; const waiting = [];
  function pump() { while (active < 6 && waiting.length) { active++; const job = waiting.shift(); job().finally(() => { active--; pump(); }); } }
  function loadThumb(id) {
    if (!thumbs.has(id)) thumbs.set(id, new Promise(res => {
      waiting.push(async () => {
        try { res(URL.createObjectURL(new Blob([await open(await ghRaw(`thumbs/${id}.jpg.age`), "bytes")], { type: "image/jpeg" }))); }
        catch { res(null); }
      });
      pump();
    }));
    return thumbs.get(id);
  }
  let io = null;
  function hydrateThumbs(root) {
    if (!io) io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const el = e.target, id = el.dataset.th;
      loadThumb(id).then(u => {
        if (!el.isConnected) return;
        if (u) { const im = new Image(); im.alt = ""; im.decoding = "async"; im.src = u; el.prepend(im); }
        else el.insertAdjacentHTML("afterbegin", `<span class="ph" aria-hidden="true"><b>${esc(el.dataset.tt || "")}</b></span>`);
      });
    }), { rootMargin: "300px" });
    root.querySelectorAll("[data-th]").forEach(el => io.observe(el));
  }

  /* ---------- 本文 ---------- */
  const TCRE = /\[(?:(\d{1,2}):)?(\d{1,3}):(\d{2})\]/g;
  const ytId = url => { const m = String(url || "").match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : ""; };
  const badge = (sec, vid, label, extra = "") => vid
    ? `<a class="ts" ${extra} data-v="${vid}" data-sec="${sec}" href="https://www.youtube.com/watch?v=${vid}&t=${sec}s" target="_blank" rel="noopener noreferrer">${label}</a>`
    : `<span class="ts" ${extra}>${label}</span>`;
  function tcHtml(escaped, url) {
    const vid = ytId(url);
    return escaped.replace(TCRE, (m, h, mi, s) => badge((+h || 0) * 3600 + (+mi) * 60 + (+s), vid, m.slice(1, -1)));
  }
  function inline(raw, url) {
    raw = String(raw ?? ""); let out = "", last = 0, m; MARK.lastIndex = 0;
    while ((m = MARK.exec(raw))) {
      out += tcHtml(esc(raw.slice(last, m.index)), url) + `<span class="m${m[1]}">${tcHtml(esc(m[2]), url)}</span>`;
      last = MARK.lastIndex;
    }
    return out + tcHtml(esc(raw.slice(last)), url);
  }
  function parseSections(text) {
    const out = []; let cur = null;
    const ensure = () => cur || (cur = { heading: "", body: "", points: [] }, out.push(cur), cur);
    for (const raw of String(text ?? "").split("\n")) {
      const line = raw.trimEnd(); let m;
      if ((m = line.match(/^##\s+(.*)$/))) { cur = { heading: m[1].trim(), body: "", points: [] }; out.push(cur); continue; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) { ensure().points.push(m[1].trim()); continue; }
      if (!line.trim()) continue;
      const s = ensure(); s.body = s.body ? s.body + "\n" + line.trim() : line.trim();
    }
    return out.filter(s => s.heading || s.body || s.points.length);
  }
  function headTags(h) {
    let rest = String(h ?? "").trimStart(), hidden = false, rank = 0;
    for (;;) {
      if (rest.startsWith("[非公開]")) { hidden = true; rest = rest.slice(5).trimStart(); continue; }
      const m = rest.match(/^\[(★{1,3})\]/);
      if (m) { rank = m[1].length; rest = rest.slice(m[0].length).trimStart(); continue; }
      break;
    }
    return { hidden, rank, bare: rest.trim() };
  }
  const paras = (text, url) => String(text ?? "").split("\n").filter(l => l.trim()).map(l => `<p>${inline(l, url)}</p>`).join("");
  function sectionsHtml(text, url) {
    return parseSections(text).map(s => {
      const t = headTags(s.heading);
      return (s.heading ? `<h3>${t.hidden ? '<span class="hid">非公開</span>' : ""}${t.rank ? `<span class="star">${"★".repeat(t.rank)}</span>` : ""}${inline(t.bare, url)}</h3>` : "")
        + paras(s.body, url)
        + (s.points.length ? `<ul>${s.points.map(p => `<li>${inline(p, url)}</li>`).join("")}</ul>` : "");
    }).join("");
  }

  /* ---------- 保存形式の読み書き(clipstock/src/lib の移植): 時刻・セクション・マーカー ---------- */
  const TC1 = /\[(?:(\d{1,2}):)?(\d{1,3}):(\d{2})\]/;
  const cpLen = s => { let n = 0; for (const _ of String(s)) n++; return n; };
  const parseTc = t => { const m = String(t ?? "").match(TC1); return m ? (m[1] ? +m[1] : 0) * 3600 + (+m[2]) * 60 + (+m[3]) : null; };
  const fmtTc = sec => { const s = Math.max(0, Math.floor(+sec || 0)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + pad(m) : String(m)) + ":" + pad(s % 60); };
  const stripTc = t => String(t ?? "").replace(new RegExp(TC1.source, "g"), "").replace(/\s{2,}/g, " ").trim();
  const splitLabel = t => { const raw = String(t ?? ""), at = parseTc(raw); return { text: at === null ? raw.trim() : stripTc(raw), at }; };
  const withTc = (t, sec) => { const b = String(t ?? "").trim(); return sec == null ? b : `${b} [${fmtTc(sec)}]`; };
  function serializeSections(secs) {
    return secs.map(s => {
      const out = [];
      if (s.heading) out.push("## " + String(s.heading).trim());
      if (s.body) out.push(String(s.body).trim());
      (s.points || []).forEach(p => { const t = String(p ?? "").trim(); if (t) out.push("- " + t); });
      return out.join("\n");
    }).filter(Boolean).join("\n");
  }
  /* マーカーは <m1>text</m1> の形で本文に直接埋め込む(旧画面と同じ形式。位置の座標は持たない) */
  function toFlat(raw) {
    const flat = [], re = /<m([123])>([\s\S]*?)<\/m\1>|([^<]+)|(<)/g; let m; raw = String(raw ?? "");
    while ((m = re.exec(raw))) {
      if (m[1]) for (const ch of m[2]) flat.push([ch, +m[1]]);
      else if (m[3]) for (const ch of m[3]) flat.push([ch, 0]);
      else flat.push(["<", 0]);
    }
    return flat;
  }
  function fromFlat(flat) {
    let out = "", i = 0;
    while (i < flat.length) {
      const mk = flat[i][1]; let j = i;
      while (j < flat.length && flat[j][1] === mk) j++;
      const seg = flat.slice(i, j).map(f => f[0]).join("");
      out += mk ? `<m${mk}>${seg}</m${mk}>` : seg; i = j;
    }
    return out;
  }
  const plainOf = raw => toFlat(raw).map(f => f[0]).join("");
  function markRange(raw, s, e, c) { const f = toFlat(raw); for (let i = s; i < e && i < f.length; i++) f[i][1] = c; return fromFlat(f); }
  function getMarked(fieldRaw, a) {
    if (a.kind === "whole") return String(fieldRaw ?? "");
    const sec = parseSections(fieldRaw)[a.sec]; if (!sec) return "";
    return a.kind === "body" ? sec.body : splitLabel(sec.points[a.point] ?? "").text;
  }
  function setMarked(fieldRaw, a, value) {
    if (a.kind === "whole") return value;
    const secs = parseSections(fieldRaw), sec = secs[a.sec]; if (!sec) return String(fieldRaw ?? "");
    if (a.kind === "body") sec.body = value;
    else { const { at } = splitLabel(sec.points[a.point] ?? ""); sec.points[a.point] = withTc(value, at); }
    return serializeSections(secs);
  }

  /* 本文を「マーカーを引ける対象」ごとに描く。文字の断片には対象内の位置(data-s)を持たせ、選択範囲から位置を割り出す */
  const addrAttrs = (f, k, sec, pt) => `data-mf="${f}" data-mk="${k}"${sec == null ? "" : ` data-ms="${sec}"`}${pt == null ? "" : ` data-mp="${pt}"`}`;
  function groupHtml(g, mk, vid) {
    const str = g.map(c => c[0]).join(""); let html = "", last = 0, m;
    const re = new RegExp(TC1.source, "g");
    const at = u16 => g[cpLen(str.slice(0, u16))][2];
    const piece = (a, b) => b > a ? `<span class="mt" data-s="${at(a)}">${esc(str.slice(a, b))}</span>` : "";
    while ((m = re.exec(str))) {
      html += piece(last, m.index) + badge(parseTc(m[0]), vid, m[0].slice(1, -1), `data-s="${at(m.index)}" data-n="${cpLen(m[0])}"`);
      last = m.index + m[0].length;
    }
    html += piece(last, str.length);
    return mk ? `<span class="m${mk}" data-ms="${g[0][2]}" data-me="${g[g.length - 1][2] + 1}">${html}</span>` : html;
  }
  function flatLinesHtml(flat, tag, attrs, vid, after = "") {
    const lines = []; let cur = [];
    flat.forEach(([ch, mk], i) => { if (ch === "\n") { lines.push(cur); cur = []; } else cur.push([ch, mk, i]); });
    lines.push(cur);
    const rows = lines.filter(l => l.length);
    if (!rows.length) return after ? `<${tag} ${attrs}>${after}</${tag}>` : "";
    return rows.map((l, n) => {
      let html = "", i = 0;
      while (i < l.length) { let j = i; while (j < l.length && l[j][1] === l[i][1]) j++; html += groupHtml(l.slice(i, j), l[i][1], vid); i = j; }
      return `<${tag} ${attrs}>${html}${n === rows.length - 1 ? after : ""}</${tag}>`;
    }).join("");
  }
  function flowHtml(b) {
    const vid = ytId(b.url); let out = "";
    const add = (k, label, html) => { if (html) out += `<h2 id="sec-${k}">${label}</h2>${html}`; };
    if (String(b.summary || "").trim()) add("sm", "サマリ", flatLinesHtml(toFlat(b.summary), "p", addrAttrs("summary", "whole"), vid));
    for (const [k, label, field] of [["fl", "分野別", "fields"], ["ap", "応用", "apply"], ["id", "活用", "ideas"]]) {
      const text = b[field]; if (!String(text || "").trim()) continue;
      let html = "";
      parseSections(text).forEach((s, si) => {
        const t = headTags(s.heading);
        if (s.heading) html += `<h3>${t.hidden ? '<span class="hid">非公開</span>' : ""}${t.rank ? `<span class="star">${"★".repeat(t.rank)}</span>` : ""}${inline(t.bare, b.url)}</h3>`;
        if (s.body) html += flatLinesHtml(toFlat(s.body), "p", addrAttrs(field, "body", si), vid);
        if (s.points.length) html += "<ul>" + s.points.map((p, pi) => {
          const { text: tx, at } = splitLabel(p);
          return flatLinesHtml(toFlat(tx), "li", addrAttrs(field, "point", si, pi), vid, at == null ? "" : badge(at, vid, fmtTc(at)));
        }).join("") + "</ul>";
      });
      add(k, label, html);
    }
    if (String(b.memo || "").trim()) add("me", "メモ", paras(b.memo, b.url));
    return out;
  }

  async function getBundle(id) {
    let base = S.bundles.get(id);
    if (!base) {
      const it = S.byId.get(id);
      try { base = JSON.parse(await open(await ghRaw(`items/${id}.json.age`))); }
      catch (e) { if (e.code !== 404) throw e; base = { id, title: it?.t || "", url: it?.url || "", src: it?.src || "video", transcript: "", memo: "" }; }
      S.bundles.set(id, base);
    }
    const o = S.ovl[id];
    if (o) {   // web-archive が手元の変更に追いついた項目は、手元の分を外す
      let dirty = false;
      for (const k of Object.keys(o.detail || {})) if ((base[k] ?? "") === o.detail[k]) { delete o.detail[k]; dirty = true; }
      if (o.memo !== undefined && (base.memo ?? "") === o.memo) { delete o.memo; dirty = true; }
      if (dirty) { if (!o.g && o.memo === undefined && !Object.keys(o.detail || {}).length) delete S.ovl[id]; saveOvl(); }
    }
    const o2 = S.ovl[id];
    return o2 ? { ...base, ...(o2.detail || {}), memo: o2.memo ?? base.memo } : base;
  }

  /* 本文・文字起こし・マインドマップを、目次から切り替えて表示する */
  function renderBundle(it, b, keep) {
    S.curBundle = b;
    $("#vhead").innerHTML = `<h1>${esc(b.title || it.t)}${isNew(it) ? '<span class="newb">新着</span>' : ""}${RS.fin[it.id]?.v ? '<span class="finb">読了</span>' : ""}</h1><div class="sub"><span>${esc(kindOf(it))} ・ ${md(it.c)}${it.d ? " ・ " + dur(it.d) : ""}${b.model ? " ・ " + esc(b.model) : ""}</span></div>`;
    $("#openSrc").disabled = !b.url; updateKindBtn(); updateFavBtn();
    $("#openSrc").textContent = it.src === "web" ? "▶ 記事を開く" : "▶ 動画を開く";
    renderStage(keep);
  }
  function renderStage(keep) {
    const it = S.byId.get(S.cur), b = S.curBundle; if (!it || !b) return;
    const old = $("#sheet"), keepLeft = old ? old.scrollLeft : 0, keepTop = old ? old.scrollTop : 0;
    hideSelTool();
    let html;
    if (S.view === "transcript") {
      const lines = String(b.transcript || "").split("\n").filter(Boolean).map(l => `<p class="tline">${tcHtml(esc(l), b.url)}</p>`).join("");
      html = lines ? `<div class="sheet tr" id="sheet"><div class="flow"><h2>文字起こし</h2>${lines}</div></div>` : `<p class="empty">文字起こしがまだありません。</p>`;
    } else if (S.view === "mindmap") {
      html = `<div class="sheet mmwrap" id="sheet"><div class="mm-host" id="mmHost"></div></div>`;
    } else {
      const body = flowHtml(b);
      html = body ? `<div class="sheet" id="sheet"><div class="flow">${body}</div></div>` : `<p class="empty">この動画にはまだ要約がありません。</p>`;
    }

  function parseMap(md) {
    const root = { l: "", ch: [] }; let stack = [{ d: 0, n: root }];
    String(md ?? "").split("\n").forEach(line => {
      let m;
      if ((m = line.match(/^#\s+(.*)/))) { root.l = m[1]; stack = [{ d: 0, n: root }]; }
      else if ((m = line.match(/^##\s+(.*)/))) { const n = { l: m[1], ch: [] }; root.ch.push(n); stack = [{ d: 0, n: root }, { d: 1, n }]; }
      else if ((m = line.match(/^(\s*)[-*]\s+(.*)/))) {
        const d = 2 + Math.floor(m[1].length / 2), n = { l: m[2], ch: [] };
        while (stack.length > 1 && stack[stack.length - 1].d >= d) stack.pop();
        stack[stack.length - 1].n.ch.push(n); stack.push({ d, n });
      }
    });
    return root;
  }

  /* ---------- 要約AI(「選択を要約する」で使う AI)。暗号化して記録に保存し、ほかの端末でも使う ---------- */
  const AI_LIST = {
    anthropic: { name: "Claude", model: "claude-sonnet-5-5", models: ["claude-sonnet-5-5", "claude-haiku-5-5", "claude-opus-5-5"], key: "sk-ant-…", where: "console.anthropic.com の API Keys" },

    openai: { name: "OpenAI", model: "gpt-5-mini", models: ["gpt-5-mini", "gpt-5", "gpt-4.1-mini"], key: "sk-…", where: "platform.openai.com の API keys" },
    ollama: { name: "Ollama", model: "", models: [], key: "（なくて構いません）", where: "", local: true },
  };
  const OLLAMA_URL = "", OLLAMA_CTX = 16384;
  const aiCfg = () => { const v = RS.misc.ai?.v; return v && AI_LIST[v.provider] && (v.provider === "ollama" ? v.url && v.model : v.key) ? v : null; };
  const aiPayload = ai => !ai ? null : ai.provider === "ollama"
    ? { provider: "ollama", model: ai.model, key: ai.key || "", url: ai.url, ctx: Number(ai.ctx) || OLLAMA_CTX }
    : { provider: ai.provider, model: ai.model || AI_LIST[ai.provider].model, key: ai.key };
  const aiLabel = ai => ai ? `${AI_LIST[ai.provider].name}・${ai.model || AI_LIST[ai.provider].model}` : "GAS の Gemini";
  function aiError(m, ai) {
    if (ai?.provider === "ollama" && /Summarize\.gs|unknown action/i.test(m)) return "要約の窓口（GAS）が古いままです。新しい Summarize.gs と Code.gs を貼り、「新バージョン」でデプロイし直してください。";
    if (/^AI_NOT_SET/.test(m)) return "要約AIが設定されていません。「要約AI」で、AI と API キーを設定してください。";
    if (/GEMINI_API_KEY/.test(m)) return ai
      ? "要約の窓口（GAS）が古いままで、設定した AI を使えません。新しい Summarize.gs と Code.gs を貼り、「新バージョン」でデプロイし直してください。"
      : "要約AIが設定されていません。「要約AI」で、AI と API キーを設定してください。";

  /* ---------- Ollama(議事録アプリ minutes の llm-client.js と同じ: ブラウザから直接、OpenAI 互換の /v1 を呼ぶ)
     GAS からだと ngrok の先が応答しないため。文字起こしの受け取りと保存だけ GAS(aiPlan・importSummary) ---------- */
  const ollamaBase = u => String(u || "").trim().replace(/\/+$/, "");
  const ollamaV1 = u => { const b = ollamaBase(u).replace(/\/(chat\/completions|models)$/, "").replace(/\/api$/, ""); return /\/v1$/.test(b) ? b : b + "/v1"; };
  let cspBlocked = "";
  document.addEventListener("securitypolicyviolation", e => { if (String(e.violatedDirective || "").startsWith("connect-src")) cspBlocked = e.blockedURI || ""; });
  function ollamaNetError(ai) {
    const base = ollamaV1(ai.url);
    let origin = ""; try { origin = new URL(base).origin; } catch {}
    if (cspBlocked && origin && cspBlocked.startsWith(origin)) {
      cspBlocked = "";
      return new Error(`この URL（${base}）は、ClipStock が通信を許可している先に入っていません。使えるのは ngrok（*.ngrok-free.dev など）、*.trycloudflare.com、http://localhost です。ほかの先は、index.html 先頭の Content-Security-Policy の connect-src に足してください。`);
    }
    return new Error(`Ollama（${base}）につながりませんでした。\n・Mac の Ollama と ngrok が起動しているか（ngrok の URL は、起動し直すと変わることがあります）\n・このサイト（${location.origin}）からの呼び出しを許可しているか（Ollama なら OLLAMA_ORIGINS）`);

    const h = {};

  async function ollamaFetch(ai, path, body) {
    let r;
    try { r = await fetch(ollamaV1(ai.url) + path, body ? { method: "POST", headers: ollamaHeaders(ai, true), body: JSON.stringify(body) } : { headers: ollamaHeaders(ai, false) }); }
    catch { throw ollamaNetError(ai); }
    const t = await r.text();
    if (r.status === 404 && body && /model/i.test(t)) throw new Error(`モデル「${ai.model}」が見つかりません（大文字・小文字も区別されます）。「接続を試す」で出る一覧から選び直してください。`);

  async function ollamaAsk(ai, system, user) {

      num_ctx: Number(ai.ctx) || OLLAMA_CTX,     // Ollama 独自。minutes と同じく足す
      messages: [{ role: "system", content: system }, { role: "user", content: user }] });
    const c = j.choices?.[0]?.message?.content || "";
    if (!c.trim()) throw new Error("Ollama から応答がありませんでした。");

  }
  const pickJson = t => { const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a < 0 || b < 0) throw new Error("応答からJSONを取り出せませんでした"); return JSON.parse(t.slice(a, b + 1)); };
  // 文字起こしを渡す上限(文字)。日本語はおよそ1トークン1字強。指示文と答えの分を残す
  const ollamaLimit = ai => Math.max(3000, Math.floor((Number(ai.ctx) || OLLAMA_CTX) * 1.1) - 5000);
  /** Ollama で5段を作り、窓口(GAS)の取り込みで保存する(時刻付けは GAS 側で、ほかの AI と同じ) */
  async function ollamaSummarize(x, ai, say) {
    const plan = await gas("aiPlan", { pageId: x.id, source: x.src, limit: ollamaLimit(ai) }, { waits: [400, 1500] });
    const parts = {}, failed = [];
    say("サマリ");
    parts.summary = String(pickJson(await ollamaAsk(ai, plan.system, plan.input + plan.tails.summary)).summary || "").trim();
    if (!parts.summary) throw new Error("サマリを作れませんでした。");

    for (const [k, lab, prompt, take] of steps) {
      say(lab);
      try { const v = take(pickJson(await ollamaAsk(ai, plan.system, prompt()))); if (v) parts[k] = v; else failed.push(k); } catch { failed.push(k); }
    }

    const fieldsText = (Array.isArray(parts.fields) ? parts.fields : []).map(f => [`## ${f?.name || ""}`, f?.summary || "", ...(f?.points || []).map(p => "- " + (typeof p === "string" ? p : p?.text || ""))].join("\n")).join("\n\n");
    const ctx = ["動画タイトル: " + plan.title, "", "# サマリ", parts.summary, "", "# 分野別要約", fieldsText].join("\n").slice(0, 8000);
    for (const [k, lab] of [["apply", "応用"], ["ideas", "活用"]]) {

    if (opened) { d.opens++; i.opens++; }

      const mts = g.flatMap(el => [...el.querySelectorAll(".mt[data-s]")]); if (!mts.length) continue;
      const s0 = Math.min(...mts.map(m => +m.dataset.s)), e0 = Math.max(...mts.map(m => +m.dataset.s + cpLen(m.textContent)));

    return { segs, addr: segs[0]?.addr, s: segs[0]?.s, e: segs[0]?.e, text: segs.map(g => g.q).join("\n"), copy, rect: { left: q.left, right: q.right, top: q.top, bottom: q.bottom, width: q.width } };

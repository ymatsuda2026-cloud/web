<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src data: blob: 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>書庫</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26335a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="書庫">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f7f5; --sheet:#ffffff; --ink:#1c222c; --muted:#5f6878; --line:#d5dae1;
  --cloth:#26335a; --cloth-ink:#e9ecf4; --foil:#a9822a; --foil-text:#7d5f17; --foil-soft:rgba(169,130,42,.14);
  --desk:#e8e5dd; --bunko:#f7f1e3; --bunko-ink:#2a2622; --bunko-muted:#6b6457; --bunko-rule:rgba(60,40,10,.18);
  --danger:#a33a2b;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14171c; --sheet:#1b1f26; --ink:#e4e7ec; --muted:#a0a8b5; --line:#323844;
    --cloth:#121a30; --cloth-ink:#dfe4f0; --foil:#d7b25a; --foil-text:#d7b25a; --foil-soft:rgba(215,178,90,.16);
    --desk:#101318; --bunko:#25221c; --bunko-ink:#e6dfcf; --bunko-muted:#a69e8c; --bunko-rule:rgba(230,220,200,.18);
    --danger:#e08a7b; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
/* スマホで触っても画面全体が動かないよう固定する（拡大・ずれ・引っぱりの跳ね返りを止める） */
html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; -webkit-text-size-adjust:100%}
body{position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  margin:0; height:auto; background:var(--paper); color:var(--ink); font:15px/1.6 var(--sans); display:flex; flex-direction:column}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--cloth)}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foil); outline-offset:2px}

/* 鍵の画面 */
.gate{flex:1; overflow:auto; background:var(--cloth); color:var(--cloth-ink); display:flex; align-items:flex-start; justify-content:center; padding:48px 18px}
.gate-card{width:min(440px,100%); background:var(--paper); color:var(--ink); border-radius:10px; padding:28px 26px 24px; box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gate h1{font-family:var(--serif); font-size:30px; letter-spacing:.12em; margin:0 0 4px}
.gate .lead{color:var(--muted); font-size:13.5px; margin:0 0 20px}
.f{display:block; margin-bottom:14px}
.f span{display:block; font-size:13px; font-weight:500; margin-bottom:4px}
.f small{display:block; font-size:12px; color:var(--muted); margin-top:3px; line-height:1.6}
.f input,.f textarea{width:100%; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:9px 10px; font-size:14px}
.f textarea{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; min-height:64px; resize:vertical}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.go{width:100%; border:0; border-radius:6px; background:var(--cloth); color:var(--cloth-ink); padding:12px; font-size:15px; font-weight:500; margin-top:6px}
.go[disabled]{opacity:.6; cursor:default}
.msg{min-height:1.4em; font-size:13px; margin-top:10px; color:var(--danger)}
.link{border:0; background:none; padding:0; color:var(--muted); font-size:12.5px; text-decoration:underline; margin-top:14px}

/* 上の帯 */
.bar{background:var(--cloth); color:var(--cloth-ink); display:flex; align-items:center; gap:10px; padding:10px 14px}
.brand{font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:.08em}
.search{flex:1; max-width:320px; margin-left:auto; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:var(--cloth-ink); border-radius:6px; padding:6px 10px; font-size:13.5px}
.search::placeholder{color:rgba(233,236,244,.65)}
.hb{border:1px solid rgba(255,255,255,.35); background:transparent; color:var(--cloth-ink); border-radius:6px; min-height:32px; padding:0 11px; font-size:13px}
.status{font-size:12px; color:var(--muted); padding:4px 16px; min-height:0}
.status:empty{display:none}

/* 本棚と本文 */
.grid{flex:1; min-height:0; display:grid; grid-template-columns:290px minmax(0,1fr)}
#shelf{border-right:1px solid var(--line); overflow:auto; padding:8px 0 40px}
.book{border-bottom:1px solid var(--line)}
.book-head{display:block; width:100%; text-align:left; border:0; background:none; padding:10px 16px}
.book-head:hover{background:var(--foil-soft)}
.book-title{font-family:var(--serif); font-weight:600; font-size:15px; line-height:1.45}
.book-meta{font-size:12px; color:var(--muted)}
.resume{display:flex; align-items:center; gap:6px; margin:0 16px 8px; border:1px solid var(--foil); background:var(--foil-soft); color:var(--ink); border-radius:5px; padding:4px 10px; font-size:12.5px}
.ch{display:block; width:100%; text-align:left; border:0; background:none; padding:5px 16px 5px 26px; font-size:13px}
.ch:hover{background:var(--foil-soft)}
.ch.on{background:var(--foil-soft); box-shadow:inset 3px 0 0 var(--foil)}
.keep{display:flex; align-items:center; gap:6px; margin:0 16px 8px; border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:5px; padding:4px 10px; font-size:12px}
.keep.on{border-style:solid; border-color:var(--foil); color:var(--ink)}
.offl{font-size:11px; color:var(--foil-text); margin-left:6px}
.empty{color:var(--muted); font-size:13.5px; padding:20px 16px; line-height:1.8; writing-mode:horizontal-tb}

#reader{display:flex; flex-direction:column; min-height:0; overflow:hidden; background:var(--desk)}
.rtools{display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--paper); flex-wrap:wrap}
.rtools .sp{flex:1}
.tb{border:1px solid var(--line); background:var(--sheet); border-radius:6px; min-height:32px; min-width:36px; padding:0 10px; font-size:13px; display:inline-flex; align-items:center; gap:4px}
.tb:hover{border-color:var(--foil)}
.seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{border:0; background:var(--sheet); min-height:32px; padding:0 12px; font-size:13px; color:var(--muted)}
.seg button.on{background:var(--cloth); color:var(--cloth-ink)}
.stage{flex:1; min-height:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; touch-action:none; overscroll-behavior:none}
#shelf,#manage,#night,.gate{overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
.stage>.empty{max-width:30em}
.spread{display:flex; position:relative;
  --gut:rgba(60,40,10,.13)}
.vert .spread{flex-direction:row-reverse}
.sheet{position:relative; width:var(--pw); height:var(--ph); background:var(--bunko); color:var(--bunko-ink);
  box-shadow:0 10px 30px rgba(20,24,40,.18), 0 1px 3px rgba(20,24,40,.12)}
.two .s0{background-image:linear-gradient(to left, var(--gut), transparent 34px)}
.two .s1{background-image:linear-gradient(to right, var(--gut), transparent 34px)}
.vert .two .s0{background-image:linear-gradient(to right, var(--gut), transparent 34px)}
.vert .two .s1{background-image:linear-gradient(to left, var(--gut), transparent 34px)}
.vp{position:absolute; overflow:hidden; left:var(--ml); top:var(--mt); width:var(--tw); height:var(--th)}
.flow{width:var(--tw); height:var(--th); column-width:var(--tw); column-gap:var(--cg); column-fill:auto;
  font-family:var(--serif); font-size:var(--fs); line-height:1.9}
.vert .flow{writing-mode:vertical-rl; column-width:var(--th); line-height:1.8}
.runhead{position:absolute; top:calc(var(--mt) * .4); left:var(--ml); right:var(--ml); font-size:10.5px; color:var(--bunko-muted);
  letter-spacing:.12em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vert .runhead{text-align:right}
.nombre{position:absolute; bottom:calc(var(--mb) * .36); left:0; right:0; text-align:center; font-size:10.5px; color:var(--bunko-muted); font-family:var(--serif)}
.ribbon{position:absolute; top:-6px; right:18%; width:9px; height:calc(var(--mt) + 34px); background:var(--foil);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 6px),0 100%); z-index:1}
.vert .ribbon{right:auto; left:18%}
.ctitle{font-size:1.45em; font-weight:600; line-height:1.5; margin:0; margin-block-end:1.4em; break-after:avoid}
.vert .ctitle{padding-inline-start:3em}
.blk{margin:0; text-indent:1em; text-align:justify; border-radius:2px; transition:background .6s; orphans:1; widows:1}
.blk.h{text-indent:0; font-weight:600; font-size:1.15em; margin-block:1.2em .6em; break-after:avoid}
.vert .blk.h{padding-inline-start:2em}
.blk.hit{background:var(--foil-soft)}
.pg{font-family:var(--sans); font-size:10.5px; color:var(--bunko-muted); margin-block:1.1em .6em; border-block-start:1px dashed var(--bunko-rule); padding-block-start:2px; text-align:end}
.chnav{display:flex; flex-wrap:wrap; gap:10px; margin-block-start:2.4em; font-family:var(--sans); font-size:13px; break-inside:avoid}
.chnav button{border:1px solid var(--bunko-rule); background:transparent; color:var(--bunko-ink); border-radius:6px; padding:8px 14px; writing-mode:horizontal-tb}
.chnav button:hover{border-color:var(--foil)}
/* 選択：見開きをまたいでも1つの選択として扱う（左右のページに同じ色で表示） */
.runhead,.nombre,.pg,.turn{-webkit-user-select:none; user-select:none}
.flow ::selection{background:rgba(66,133,244,.30); color:inherit}
::highlight(xsel){background-color:rgba(66,133,244,.30); color:inherit}
.turn{position:absolute; top:0; bottom:0; width:11%; min-width:44px; border:0; background:transparent; z-index:3; color:var(--muted); font-size:28px; opacity:0; transition:opacity .2s}
.turn:hover,.turn:focus-visible{opacity:.7}
.turn.l{left:0} .turn.r{right:0}
body.full .turn{color:var(--cloth-ink)}
.pginfo{font-size:12px; color:var(--muted); min-width:5.5em; text-align:center; font-variant-numeric:tabular-nums}
body.full .pginfo{color:var(--cloth-ink)}
.pbar{height:3px; background:var(--line); position:relative}
.pbar i{position:absolute; top:0; bottom:0; left:0; background:var(--foil)}
.vert .pbar i{left:auto; right:0}

body.full .bar, body.full #shelf, body.full .tabbar, body.full .status{display:none !important}
body.full .grid{grid-template-columns:minmax(0,1fr)}
body.full #reader{display:flex !important; background:var(--cloth)}
body.full .rtools{background:rgba(10,16,34,.55); border-color:transparent; color:var(--cloth-ink)}
body.full .rtools .tb{background:transparent; color:var(--cloth-ink); border-color:rgba(255,255,255,.3)}
body.full .seg{border-color:rgba(255,255,255,.3)}
body.full .seg button{background:transparent; color:var(--cloth-ink)}
body.full .seg button.on{background:var(--bunko); color:var(--cloth)}

.tabbar{display:none}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  #shelf:not(.show), #reader:not(.show){display:none}
  #shelf{border-right:0}
  .tabbar{display:flex; background:var(--paper); border-top:1px solid var(--line)}
  :root{padding-bottom:0}
  .tabbar{padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{flex:1; border:0; background:none; padding:11px 0; font-size:13px; color:var(--muted)}
  .tabbar button.on{color:var(--ink); box-shadow:inset 0 2px 0 var(--foil)}
  .bar .hb .lbl, .rtools .lbl{display:none}
  .search{max-width:none; min-width:0; font-size:16px; padding:5px 9px}
  .bar{gap:6px; padding:8px 10px}
  .brand{white-space:nowrap; font-size:18px}
  .hb{white-space:nowrap; padding:0 8px; flex:none}
  .rtools{gap:4px; padding:6px 8px}
  .seg button{padding:0 8px; font-size:12px}
  .tb{padding:0 7px; min-width:32px; font-size:12px}
  .turn{opacity:0 !important}
}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}

/* 変換管理 */
.hb[aria-pressed="true"]{background:var(--foil); border-color:var(--foil); color:#fff}
#manage{flex:1; min-height:0; overflow:auto; padding:0 0 40px}
.mtools{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; background:var(--paper); border-bottom:1px solid var(--line)}
.mtools .sp{flex:1}
.mtools input[type=search]{min-width:200px; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:6px 10px; font-size:13.5px}
.seg button .n{margin-left:5px; font-size:11.5px; opacity:.8; font-variant-numeric:tabular-nums}
.tb.main{background:var(--cloth); color:var(--cloth-ink); border-color:var(--cloth)}
.tb[disabled]{opacity:.45; cursor:default}
.mnote{margin:10px 16px 4px; font-size:13px; color:var(--muted); line-height:1.7}
.mlist{padding:0 16px}
.mrow{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer}
.mrow:hover{background:var(--foil-soft)}
.mrow input{width:17px; height:17px; accent-color:var(--cloth); margin:0}
.mrow input[disabled]{opacity:.3}
.mt{font-family:var(--serif); font-weight:600; font-size:14.5px; line-height:1.45}
.mm{font-size:12px; color:var(--muted)}
.mst{font-size:11.5px; border-radius:10px; padding:1px 9px; white-space:nowrap}
.mst.todo{background:var(--line); color:var(--muted)}
.mst.queue{background:var(--foil-soft); color:var(--foil-text); border:1px solid var(--foil)}
.mst.done{background:var(--cloth); color:var(--cloth-ink)}
#night{flex:1; min-height:0; overflow:auto; padding:16px 18px 48px}
#night h2{font-family:var(--serif); font-size:18px; margin:0 0 12px}
#night h3{font-size:14px; margin:24px 0 8px}
.nmet{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.nm{background:var(--sheet); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.nm .l{font-size:12px; color:var(--muted)} .nm .v{font-size:21px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums}
.nm .s{font-size:12px; color:var(--muted); margin-top:2px}
.nm.ok{border-color:#3f8a55} .nm.ng{border-color:#b0453a; background:rgba(176,69,58,.07)}
.nm.ok .v{color:#2f7a45} .nm.ng .v{color:#a63d32}
.nrows{border-top:1px solid var(--line)}
.nr{display:flex; gap:12px; align-items:baseline; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13.5px; flex-wrap:wrap}
.nr .d{color:var(--muted); font-size:12.5px; min-width:9.5em; font-variant-numeric:tabular-nums}
.nr .ttl{font-family:var(--serif); font-weight:600}
.nr.err{color:#a63d32}
.ntable{width:100%; border-collapse:collapse; font-size:13px}
.ntable th,.ntable td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
.ntable th{color:var(--muted); font-weight:500; font-size:12px}
.ntable td.num{text-align:right; font-variant-numeric:tabular-nums}
.ntable tr.sel td{background:var(--foil-soft)}
.ntable tbody tr{cursor:pointer}
.nbad{color:#a63d32} .ngood{color:#2f7a45}
.nwrap{overflow-x:auto}
.ntail{font:12px/1.6 ui-monospace,Menlo,monospace; background:var(--sheet); border:1px solid var(--line); border-radius:6px; padding:10px 12px; white-space:pre-wrap; word-break:break-all; max-height:260px; overflow:auto}
.nnote{font-size:13px; color:var(--muted); line-height:1.75; background:var(--sheet); border:1px dashed var(--line); border-radius:8px; padding:10px 14px; margin-top:12px}
.nnote code{font-size:12px}
/* 本棚の表示切り替えと表紙の並び */
.shelfbar{position:sticky; top:-8px; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 14px 8px; margin-top:-8px; background:var(--paper); border-bottom:1px solid var(--line)}
.shelfbar .n{font-size:12px; color:var(--muted); margin-left:auto}
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:16px 12px; padding:12px 14px 8px}
.scard{display:flex; flex-direction:column; gap:4px; border:0; background:none; padding:0; text-align:left; color:var(--ink); cursor:pointer; min-width:0}
.scard .mcover{width:100%}
.scard.cur .mcover{outline:3px solid var(--foil); outline-offset:2px}
.sbadge{position:absolute; right:5px; bottom:5px; z-index:2; display:flex; gap:4px}
.sbadge span{font-size:10.5px; border-radius:9px; padding:0 6px; line-height:1.7; background:rgba(255,255,255,.92); color:#3a3a3a; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sdetail{padding:12px 14px 4px}
.sback{border:0; background:none; color:var(--foil-text); font-size:13px; padding:4px 0; margin-bottom:8px; cursor:pointer}
.shead{display:grid; grid-template-columns:84px minmax(0,1fr); gap:12px; align-items:start; margin-bottom:10px}
.shead .mcover{width:84px}
.shead .book-title{margin:2px 0 4px}
@media (max-width:820px){ .sgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))} }

/* サムネイル表示 */
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:20px 16px; padding:6px 0 10px}
.mcard{position:relative; display:flex; flex-direction:column; gap:5px; cursor:pointer; min-width:0}
.mcover{position:relative; aspect-ratio:1/1.45; border-radius:3px 6px 6px 3px; overflow:hidden; background:hsl(var(--h) 28% 34%);
  box-shadow:inset 6px 0 0 rgba(0,0,0,.18), 0 5px 12px rgba(20,24,40,.18); transition:transform .15s, box-shadow .15s}
.mcard:hover .mcover{transform:translateY(-2px); box-shadow:inset 6px 0 0 rgba(0,0,0,.18), 0 9px 18px rgba(20,24,40,.24)}
.mcover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .25s}
.mcover img.on{opacity:1}
.mcover .ph{position:absolute; inset:0; padding:calc(14% + 26px) 11% 10%; display:flex; flex-direction:column; justify-content:space-between; color:#f4efe2; font-family:var(--serif)}
.mcover .ph b{font-weight:600; font-size:13.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden}
.mcover .ph i{font-style:normal; font-size:11px; opacity:.85; border-top:1px solid rgba(255,255,255,.35); padding-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mcard input{position:absolute; top:7px; left:9px; z-index:2; width:20px; height:20px; accent-color:var(--cloth); margin:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.mcard.sel .mcover{outline:3px solid var(--foil); outline-offset:2px}
.mcard.done{cursor:default}
.mcard .mst{position:absolute; right:6px; top:6px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mcard .mst.todo{background:rgba(255,255,255,.9); color:#555}
.mct{font-family:var(--serif); font-weight:600; font-size:13px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.mca{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (max-width:820px){ .mgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:16px 10px} }
.mmore{display:block; margin:14px auto; border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:7px 16px; font-size:13px}
@media (max-width:820px){
  .mtools input[type=search]{flex:1 1 100%; min-width:0; order:1}
  .mtools .sp{display:none}
  .mtools .tb{order:2; flex:1}
}
</style>
</head>
<body>

<section class="gate" id="gate">
  <div class="gate-card">
    <h1>書庫</h1>
    <p class="lead" id="gateLead"></p>

    <form id="setupForm" hidden autocomplete="off">
      <div class="two">
        <label class="f"><span>GitHubのユーザー名</span><input id="owner" required value="ymatsuda2026-cloud" autocapitalize="off" spellcheck="false"></label>
        <label class="f"><span>リポジトリ</span><input id="repo" required value="book-archive" autocapitalize="off" spellcheck="false"></label>
      </div>
      <label class="f"><span>アクセストークン</span><input id="token" type="password" required autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
        <small>book-archive だけを対象に、Contents を「Read-only」にした fine-grained トークン。</small></label>
      <label class="f"><span>復号の鍵</span><textarea id="agekey" required autocapitalize="off" spellcheck="false" placeholder="AGE-SECRET-KEY-1…"></textarea>
        <small>Mac の ~/.config/epub2gh/key.txt にある AGE-SECRET-KEY- で始まる1行。</small></label>
      <div class="two">
        <label class="f"><span>合言葉</span><input id="pass1" type="password" required minlength="8" autocomplete="new-password"></label>
        <label class="f"><span>合言葉（確認）</span><input id="pass2" type="password" required minlength="8" autocomplete="new-password"></label>
      </div>
      <small style="display:block;font-size:12px;color:var(--muted);margin:-4px 0 10px;line-height:1.6">トークンと鍵は合言葉で暗号化して、この端末のブラウザにだけ保存します。開くたびに合言葉を聞きます。</small>
      <button class="go" id="setupGo">確認して保存</button>
    </form>

    <form id="unlockForm" hidden>
      <label class="f"><span>合言葉</span><input id="pass" type="password" required autocomplete="current-password"></label>
      <button class="go" id="unlockGo">開く</button>
      <button type="button" class="link" id="reset">この端末の設定を消して、最初から設定する</button>
    </form>
    <div class="msg" id="gateMsg" role="alert"></div>
  </div>
</section>

<header class="bar" id="bar" hidden>
  <div class="brand">書庫</div>
  <input class="search" id="q" type="search" placeholder="書名・著者で探す" aria-label="書名・著者で探す">
  <button class="hb" id="nightBtn" aria-pressed="false" title="毎日23時の変換処理の結果">夜間<span class="lbl">処理</span></button>
  <button class="hb" id="manageBtn" aria-pressed="false" title="NAS の本の変換を管理する">変換<span class="lbl">管理</span></button>
  <button class="hb" id="reload" title="GitHub から読み直す">↻<span class="lbl"> 更新</span></button>
  <button class="hb" id="lock" title="鍵をかける">🔒<span class="lbl"> 鍵</span></button>
</header>
<div class="status" id="status" aria-live="polite" hidden></div>

<main class="grid" id="app" hidden>
  <nav id="shelf" class="show" aria-label="本棚"></nav>
  <article id="reader">
    <div class="rtools" id="rtools" hidden>
      <div class="seg" role="group" aria-label="組み方"><button data-wm="v">縦書き</button><button data-wm="h">横書き</button></div>
      <button class="tb" id="fsDown" aria-label="文字を小さく">A−</button>
      <button class="tb" id="fsUp" aria-label="文字を大きく">A＋</button>
      <span class="sp"></span>
      <span class="pginfo" id="pgInfo" aria-live="polite"></span>
      <span class="sp"></span>
      <button class="tb" id="bmHere" title="いま読んでいる所にしおりを挟む"><svg width="11" height="14" viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1h10v14L6 11 1 15z" fill="var(--foil)"/></svg><span class="lbl">しおり</span></button>
      <button class="tb" id="bmGo" hidden aria-label="しおりへ移動"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 7h9M8 3l4 4-4 4"/></svg><span class="lbl">しおりへ</span></button>
      <button class="tb" id="fullBtn"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg><span class="lbl" id="fullLbl">全画面</span></button>
    </div>
    <div class="stage" id="stage"><div class="empty">本棚から本と章を選んでください。</div></div>
    <div class="pbar" id="pbar" hidden><i id="pbarFill"></i></div>
  </article>
</main>
<section id="manage" hidden aria-label="変換管理">
  <div class="mtools">
    <div class="seg" id="mfilter" role="group" aria-label="状態で絞り込む">
      <button data-f="all">すべて<span class="n"></span></button>
      <button data-f="todo">未変換<span class="n"></span></button>
      <button data-f="queue">変換待ち<span class="n"></span></button>
      <button data-f="done">変換済み<span class="n"></span></button>
    </div>
    <div class="seg" id="mview" role="group" aria-label="表示の形">
      <button data-v="list">一覧</button>
      <button data-v="grid">サムネイル</button>
    </div>
    <input type="search" id="mq" placeholder="書名・著者で探す" aria-label="書名・著者で探す">
    <span class="sp"></span>
    <button class="tb main" id="mAdd" disabled>変換待ちにする</button>
    <button class="tb" id="mDel" disabled>変換待ちから外す</button>
  </div>
  <p class="mnote" id="mnote"></p>
  <div class="mlist" id="mlist"></div>
</section>
<section id="night" hidden aria-label="夜間処理の状況"></section>
<nav class="tabbar" id="tabbar" hidden>
  <button data-m="shelf" class="on">本棚</button>
  <button data-m="reader">本文</button>
</nav>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const mobile = () => matchMedia("(max-width:820px)").matches;
  const reduced = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
  const status = t => { const s = $("#status"); s.textContent = t || ""; s.hidden = !t; };
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  const VAULT = "shoko.vault", PREFS = "shoko.prefs", BMS = "shoko.bookmarks", LAST = "shoko.last";

  let secret = null, dec = null;      // 鍵を開けている間だけメモリに置く
  const S = { catalog:{}, books:[], bundles:new Map(), cur:null, ch:null, open:new Set(), q:"",
              vert:true, fs:16.5, full:false, bms: ls.get(BMS, {}), saved:new Set() };
  const p = ls.get(PREFS, {}); if (typeof p.vert === "boolean") S.vert = p.vert; if (p.fs) S.fs = p.fs;
  const savePrefs = () => ls.set(PREFS, { vert:S.vert, fs:S.fs });

  /* ---------- 合言葉で鍵とトークンを守る ---------- */
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u => btoa(String.fromCharCode(...u));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function kdf(pass, salt) {
    const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:600000, hash:"SHA-256" }, base,
                                   { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  }
  async function seal(obj, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await kdf(pass, salt), te.encode(JSON.stringify(obj))));
    return { v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct) };
  }
  async function unseal(v, pass) {
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(v.iv) }, await kdf(pass, unb64(v.salt)), unb64(v.ct));
    return JSON.parse(td.decode(pt));
  }

  /* ---------- GitHub から取得して復号 ---------- */
  async function gh(path, sec = secret) {
    const url = `https://api.github.com/repos/${encodeURIComponent(sec.owner)}/${encodeURIComponent(sec.repo)}/contents/${path}`;
    let r;
    try {
      r = await fetch(url, { cache:"no-store", headers:{ Authorization:"Bearer " + sec.token,
        Accept:"application/vnd.github.raw+json", "X-GitHub-Api-Version":"2022-11-28" } });
    } catch { throw new Error(navigator.onLine ? "GitHub につながりませんでした。通信状況を確認してください。" : "オフラインです。この本はまだこの端末に保存されていません。通信できる所で本棚の「この端末に保存」を押してください。"); }
    if (r.status === 401) throw new Error("トークンが無効か、期限切れです。");
    if (r.status === 404) {
      // リポジトリ自体は見えるのか、ファイルが無いだけなのかを切り分ける
      let repoOk = false;
      try {
        const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(sec.owner)}/${encodeURIComponent(sec.repo)}`,
          { cache:"no-store", headers:{ Authorization:"Bearer " + sec.token, "X-GitHub-Api-Version":"2022-11-28" } });
        repoOk = rr.ok;
      } catch {}
      if (repoOk && path === "index.json.age")
        throw new Error("リポジトリには接続できましたが、本の一覧（index.json.age）がまだありません。Mac で epub2gh を --no-push なしで実行して、GitHub に送ってください。");
      if (repoOk) throw new Error("見つかりません: " + path);
      throw new Error("リポジトリが見つかりません（ユーザー名・リポジトリ名、トークンの対象リポジトリを確認）。");
    }
    if (r.status === 403 || r.status === 429) throw new Error("GitHub の利用制限にかかりました。しばらくしてから試してください。");
    if (!r.ok) throw new Error("GitHub からの読み込みに失敗しました（" + r.status + "）。");
    return new Uint8Array(await r.arrayBuffer());
  }
  async function getJSON(path, sec, d = dec) {
    const bytes = await gh(path, sec);
    let txt;
    try { txt = await d.decrypt(bytes, "text"); }
    catch { throw new Error("復号できませんでした。鍵が違う可能性があります。"); }
    return JSON.parse(txt);
  }
  function makeDecrypter(key) {
    const d = new AgeLib.Decrypter();
    d.addIdentity(key.trim());
    return d;
  }

  /* ---------- 鍵の画面 ---------- */
  function showGate() {
    const has = !!ls.get(VAULT, null);
    $("#gate").hidden = false; $("#bar").hidden = $("#app").hidden = $("#tabbar").hidden = $("#manage").hidden = true; status("");
    S.inv = null; S.queue = null; S.qsha = null; S.managing = false; S.panel = null; $("#night").hidden = true;
    if (typeof TH !== "undefined") { TH.urls.forEach(u => URL.revokeObjectURL(u)); TH.urls.clear(); TH.none.clear(); }
    $("#manageBtn").setAttribute("aria-pressed", "false"); $("#nightBtn").setAttribute("aria-pressed", "false");
    document.body.classList.remove("full");
    $("#setupForm").hidden = has; $("#unlockForm").hidden = !has;
    $("#gateLead").textContent = has ? "合言葉を入れて本棚を開きます。" : "この端末で初めて開くための設定です。";
    $("#gateMsg").textContent = "";
    setTimeout(() => (has ? $("#pass") : $("#token")).focus(), 50);
  }

  $("#setupForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#gateMsg"), btn = $("#setupGo");
    const sec = { owner:$("#owner").value.trim(), repo:$("#repo").value.trim(), token:$("#token").value.trim(), key:$("#agekey").value.trim() };
    if (!/^AGE-SECRET-KEY-1[0-9A-Z]+$/.test(sec.key)) { msg.textContent = "鍵は AGE-SECRET-KEY-1 で始まる1行を貼ってください。"; return; }
    if ($("#pass1").value !== $("#pass2").value) { msg.textContent = "合言葉が一致しません。"; return; }
    btn.disabled = true; msg.textContent = ""; btn.textContent = "GitHub に接続して確認中…";
    try {
      const d = makeDecrypter(sec.key);
      const cat = await getJSON("index.json.age", sec, d);
      ls.set(VAULT, await seal(sec, $("#pass1").value));
      $("#setupForm").reset();
      start(sec, d, cat);
    } catch (err) { msg.textContent = err.message; }
    btn.disabled = false; btn.textContent = "確認して保存";
  });

  $("#unlockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#gateMsg"), btn = $("#unlockGo");
    btn.disabled = true; btn.textContent = "開いています…"; msg.textContent = "";
    try {
      let sec;
      try { sec = await unseal(ls.get(VAULT), $("#pass").value); }
      catch { throw new Error("合言葉が違います。"); }
      $("#pass").value = "";
      start(sec, makeDecrypter(sec.key), null);
    } catch (err) { msg.textContent = err.message; }
    btn.disabled = false; btn.textContent = "開く";
  });

  $("#reset").onclick = () => {
    const b = $("#reset");
    if (b.dataset.armed) { ls.del(VAULT); delete b.dataset.armed; if ("caches" in window) caches.delete("shoko-data").catch(() => {}); b.textContent = "この端末の設定を消して、最初から設定する"; showGate(); return; }
    b.dataset.armed = "1"; b.textContent = "もう一度押すと、この端末の設定を消します";
  };

  function lock() {
    secret = null; dec = null; S.bundles.clear(); S.catalog = {}; S.books = []; S.cur = null; S.ch = null;
    $("#shelf").innerHTML = ""; $("#stage").innerHTML = '<div class="empty">本棚から本と章を選んでください。</div>'; $("#rtools").hidden = true; $("#pbar").hidden = true; L = null;
    showGate();
  }
  $("#lock").onclick = lock;

  async function start(sec, d, cat) {
    secret = sec; dec = d;
    $("#gate").hidden = true; $("#bar").hidden = $("#app").hidden = $("#tabbar").hidden = false;
    applyMode();
    if (cat) setCatalog(cat); else await loadCatalog();
    netState();
    if (location.hash === "#manage") return setPanel("manage");
    if (location.hash === "#night") return setPanel("night");
    const last = ls.get(LAST, null);
    if (last && S.catalog[last.bid] && !mobile()) openChapter(last.bid, last.no, true);
  }

  async function loadCatalog() {
    $("#shelf").innerHTML = '<div class="empty">本棚を読み込み中…</div>';
    try { setCatalog(await getJSON("index.json.age")); status(""); }
    catch (e) { $("#shelf").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  $("#reload").onclick = async () => { S.bundles.clear(); await loadCatalog(); if (S.panel === "manage") loadManage(); if (S.panel === "night") loadNight(); };

  function setCatalog(cat) {
    S.catalog = cat || {};
    S.books = Object.entries(S.catalog).map(([id, b]) => ({ id, ...b }))
      .sort((a, b) => String(b.converted || "").localeCompare(String(a.converted || "")));
    renderShelf();
    refreshSaved();
  }

  /* ---------- オフライン（暗号化されたまま端末に保存） ---------- */
  const DATA_CACHE = "shoko-data";
  const apiURL = path => `https://api.github.com/repos/${encodeURIComponent(secret.owner)}/${encodeURIComponent(secret.repo)}/contents/${path}`;
  async function refreshSaved() {
    if (!("caches" in window) || !secret) return;
    try {
      const c = await caches.open(DATA_CACHE), set = new Set();
      for (const b of S.books) if (await c.match(apiURL(`books/${b.id}/bundle.json.age`))) set.add(b.id);
      S.saved = set; renderShelf();
    } catch {}
  }
  async function toggleKeep(bid) {
    const url = apiURL(`books/${bid}/bundle.json.age`);
    try {
      const c = await caches.open(DATA_CACHE);
      if (S.saved.has(bid)) { await c.delete(url); S.saved.delete(bid); status("この端末から消しました。"); }
      else {
        status("この端末に保存しています…");
        await gh(`books/${bid}/bundle.json.age`);          // 取得するとサービスワーカーが暗号化されたまま保存する
        if (!(await c.match(url))) await c.put(url, new Response(await gh(`books/${bid}/bundle.json.age`)));
        S.saved.add(bid); status("保存しました。通信できない所でも、この本を読めます。");
      }
    } catch (e) { status(e.message || "保存できませんでした。"); }
    renderShelf(); setTimeout(() => status(""), 3000);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const netState = () => { if (!secret) return; status(navigator.onLine ? "" : "オフラインです。この端末に保存した本と、一度開いたことのある本を読めます。"); };
  addEventListener("online", netState); addEventListener("offline", netState);

  /* ---------- 本棚 ---------- */
  const authorsOf = b => (b.authors || []).join(" / ");
  S.shelfView = ls.get("shoko.shelfview", "list"); S.gridBook = null;
  function shelfBar(n) {
    return `<div class="shelfbar"><div class="seg" role="group" aria-label="本棚の表示">
      <button data-sv="list" class="${S.shelfView === "list" ? "on" : ""}">一覧</button>
      <button data-sv="grid" class="${S.shelfView === "grid" ? "on" : ""}">表紙</button></div><span class="n">${n}冊</span></div>`;
  }
  const coverHTML = (b, extra = "") => `<span class="mcover" style="--h:${hashHue(b.title)}" data-thumb="${esc(b.id)}">
      <span class="ph" aria-hidden="true"><b>${esc(b.title)}</b><i>${esc(authorsOf(b) || String(b.type || "").toUpperCase())}</i></span>${extra}</span>`;
  function chapterButtons(b) {
    return (b.chapters || []).map(c => `<button class="ch${S.cur?.bid === b.id && S.cur?.no === c.no ? " on" : ""}" data-bid="${esc(b.id)}" data-no="${c.no}">${esc(c.title)}</button>`).join("");
  }
  function bookExtras(b) {
    const bm = S.bms[b.id], bmCh = bm && (b.chapters || []).find(c => c.no === bm.no);
    return (bmCh ? `<button class="resume" data-resume="${esc(b.id)}"><svg width="10" height="13" viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1h10v14L6 11 1 15z" fill="var(--foil)"/></svg>しおりから読む（${esc(bmCh.title)}）</button>` : "")
      + ("caches" in window ? `<button class="keep${S.saved.has(b.id) ? " on" : ""}" data-keep="${esc(b.id)}">${S.saved.has(b.id) ? "✓ この端末に保存済み（押すと消す）" : "↓ この端末に保存（オフライン用）"}</button>` : "");
  }
  function renderShelf() {
    const el = $("#shelf"), q = S.q.toLowerCase();
    const list = S.books.filter(b => !q || (b.title + " " + authorsOf(b)).toLowerCase().includes(q));
    if (!S.books.length) { el.innerHTML = '<div class="empty">まだ本がありません。Mac で epub2gh を実行すると、ここに並びます。</div>'; return; }
    if (!list.length) { el.innerHTML = shelfBar(0) + '<div class="empty">見つかりませんでした。</div>'; return; }
    if (S.shelfView === "grid") {
      const gb = S.gridBook && S.catalog[S.gridBook] ? S.books.find(b => b.id === S.gridBook) : null;
      if (gb) {
        el.innerHTML = shelfBar(list.length) + `<div class="sdetail">
          <button class="sback" data-gback="1">‹ 表紙の一覧へ</button>
          <div class="shead">${coverHTML(gb)}<div><div class="book-title">${esc(gb.title)}</div>
            <div class="book-meta">${esc(authorsOf(gb))}${authorsOf(gb) ? "　" : ""}${esc((gb.type || "").toUpperCase())}・${(gb.chapters || []).length}章${S.saved.has(gb.id) ? '<span class="offl">保存済み</span>' : ""}</div></div></div>
        </div><div class="book" style="border:0">${bookExtras(gb)}${chapterButtons(gb)}</div>`;
      } else {
        el.innerHTML = shelfBar(list.length) + `<div class="sgrid">${list.map(b => {
          const bm = S.bms[b.id], badges = (bm ? "<span>しおり</span>" : "") + (S.saved.has(b.id) ? "<span>保存済み</span>" : "");
          return `<button class="scard${S.cur?.bid === b.id ? " cur" : ""}" data-gb="${esc(b.id)}" title="${esc(b.title)}">
            ${coverHTML(b, badges ? `<span class="sbadge">${badges}</span>` : "")}
            <span class="mct">${esc(b.title)}</span><span class="mca">${esc(authorsOf(b))}</span></button>`;
        }).join("")}</div>`;
      }
      watchThumbs(el, el);
      return;
    }
    el.innerHTML = shelfBar(list.length) + list.map(b => {
      const open = S.open.has(b.id) || S.cur?.bid === b.id, bm = S.bms[b.id];
      const bmCh = bm && (b.chapters || []).find(c => c.no === bm.no);
      return `<div class="book">
        <button class="book-head" data-book="${esc(b.id)}" aria-expanded="${open}">
          <div class="book-title">${esc(b.title)}</div>
          <div class="book-meta">${esc(authorsOf(b))}${authorsOf(b) ? "　" : ""}${esc((b.type || "").toUpperCase())}・${(b.chapters || []).length}章${S.saved.has(b.id) ? '<span class="offl">保存済み</span>' : ""}</div>
        </button>
        ${bmCh ? `<button class="resume" data-resume="${esc(b.id)}"><svg width="10" height="13" viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1h10v14L6 11 1 15z" fill="var(--foil)"/></svg>しおりから読む（${esc(bmCh.title)}）</button>` : ""}
        ${open && "caches" in window ? `<button class="keep${S.saved.has(b.id) ? " on" : ""}" data-keep="${esc(b.id)}">${S.saved.has(b.id) ? "✓ この端末に保存済み（押すと消す）" : "↓ この端末に保存（オフライン用）"}</button>` : ""}
        ${open ? (b.chapters || []).map(c => `<button class="ch${S.cur?.bid === b.id && S.cur?.no === c.no ? " on" : ""}" data-bid="${esc(b.id)}" data-no="${c.no}">${esc(c.title)}</button>`).join("") : ""}
      </div>`;
    }).join("");
  }
  $("#q").addEventListener("input", e => { S.q = e.target.value.trim(); renderShelf(); });
  $("#shelf").addEventListener("click", e => {
    const sv = e.target.closest("[data-sv]");
    if (sv) { if (sv.dataset.sv !== S.shelfView) { S.shelfView = sv.dataset.sv; ls.set("shoko.shelfview", S.shelfView); S.gridBook = null; renderShelf(); } return; }
    const gbk = e.target.closest("[data-gb]");
    if (gbk) { S.gridBook = gbk.dataset.gb; renderShelf(); $("#shelf").scrollTop = 0; return; }
    if (e.target.closest("[data-gback]")) { S.gridBook = null; renderShelf(); return; }
    const k = e.target.closest("[data-keep]");
    if (k) return toggleKeep(k.dataset.keep);
    const h = e.target.closest("[data-book]");
    if (h) { const id = h.dataset.book; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderShelf(); return; }
    const r = e.target.closest("[data-resume]");
    if (r) { const bm = S.bms[r.dataset.resume]; return openChapter(r.dataset.resume, bm.no, false, () => jump(bm.block, false, bm.off)); }
    const c = e.target.closest("[data-bid]");
    if (c) openChapter(c.dataset.bid, Number(c.dataset.no));
  });

  /* ---------- 本文（A4比率のページ送り） ---------- */
  const stage = () => $("#stage");
  let L = null;            // いまのページ割り
  async function loadBundle(bid) {
    if (S.bundles.has(bid)) return S.bundles.get(bid);
    let b;
    try { b = await getJSON(`books/${bid}/bundle.json.age`); }
    catch (e) {
      if (/見つかりません/.test(e.message)) throw new Error("この本の表示用データがまだ GitHub にありません。Mac で epub2gh を一度実行すると追加されます。");
      throw e;
    }
    tidyBundle(b);
    S.bundles.set(bid, b);
    return b;
  }
  // 目次などに残った「[文字](xxx.html#yyy)」のリンク先を消して、文字だけにする
  function cleanLinks(t) {
    return String(t ?? "")
      .replace(/\[([^\[\]]*)\]\s*\(\s*[^()\s]*\s*\)/g, "$1")            // [文字](リンク先) → 文字
      .replace(/\(\s*[^()\s]*\.x?html?(?:#[^()\s]*)?\s*\)/gi, "")        // 取り残された (xxx.html#yyy)
      .replace(/\(\s*#[^()\s]+\s*\)/g, "")                                // (#目印)
      .replace(/^(\s*\d+\.\s*)?\[([^\[\]]*)\]\s*$/, "$1$2")                // リンク先が別の段落に分かれた [文字]
      .replace(/[ \t]+\n/g, "\n").trim();
  }
  function tidyBundle(b) {
    for (const ch of b?.chapters || []) {
      ch.title = cleanLinks(ch.title);
      ch.blocks = (ch.blocks || []).map(x => ({ ...x, text:cleanLinks(x.text) })).filter(x => x.text);
    }
    return b;
  }


  async function openChapter(bid, no, quiet, then, atEnd) {
    S.cur = { bid, no }; S.open.add(bid); renderShelf();
    if (mobile()) setMobile("reader");
    L = null; stage().innerHTML = '<div class="empty">本文を読み込み中…</div>';
    try {
      const bundle = await loadBundle(bid);
      if (S.cur.bid !== bid || S.cur.no !== no) return;
      S.ch = bundle.chapters.find(c => c.no === no) || null;
      if (!S.ch) throw new Error("この章が見つかりません。");
      $("#rtools").hidden = false; $("#pbar").hidden = false;
      ls.set(LAST, { bid, no });
      S.anchor = null;
      layout(atEnd ? { last:true } : { page:0 });
      updateBmGo();
      if (then) then();
    } catch (e) {
      S.ch = null; L = null;
      stage().innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  }

  function chapterHTML(ch = S.ch) {
    let lastPg = null, html = "";
    for (const b of ch.blocks) {
      if (b.label.startsWith("p.") && b.label !== lastPg) { html += `<div class="pg">${esc(b.label)}</div>`; lastPg = b.label; }
      const m = b.text.match(/^#{1,6}\s+(.*)/s);
      const t = (m ? m[1] : b.text).replace(/\*\*|__/g, "");
      html += `<p class="blk${m ? " h" : ""}" data-id="${esc(b.id)}">${esc(t).replace(/\n/g, "<br>")}</p>`;
    }
    return `<h1 class="ctitle">${esc(ch.title)}</h1>${html}`;
  }

  // 置ける場所に合わせて A4 縦（1:√2）のページを決める。2枚並ぶ幅があれば見開き
  function geometry() {
    const r = stage().getBoundingClientRect();
    const narrow = r.width < 560;
    const pad = narrow ? 8 : 24;
    const W = Math.max(220, r.width - pad * 2), H = Math.max(260, r.height - pad * 2);
    let pw, ph, spread = false;
    if (narrow) { pw = W; ph = H; }                       // スマホは画面いっぱいの1ページ
    else {
      ph = H; pw = ph / Math.SQRT2;
      if (pw * 2 <= W) spread = true;
      else if (pw > W) { pw = W; ph = pw * Math.SQRT2; }
    }
    pw = Math.floor(pw); ph = Math.floor(ph);
    const mt = Math.round(ph * .085), mb = Math.round(ph * .075), ml = Math.round(pw * (narrow ? .08 : .1));
    return { pw, ph, mt, mb, ml, tw:pw - ml * 2, th:ph - mt - mb, cg:40, spread };
  }

  function layout(target) {
    if (!S.ch) return;
    const g = geometry(), book = S.catalog[S.cur.bid], ch = S.ch, n = g.spread ? 2 : 1;
    const vars = `--pw:${g.pw}px;--ph:${g.ph}px;--mt:${g.mt}px;--mb:${g.mb}px;--ml:${g.ml}px;--tw:${g.tw}px;--th:${g.th}px;--cg:${g.cg}px;--fs:${S.fs}px`;
    const html = chapterHTML();
    let sheets = "";
    for (let i = 0; i < n; i++) {
      const head = n === 1 ? `${book.title}　${ch.title}` : (i === 0 ? book.title : ch.title);
      sheets += `<div class="sheet s${i}"><div class="runhead">${esc(head)}</div><div class="vp"><div class="flow"${i ? ' aria-hidden="true"' : ""}>${html}</div></div><div class="nombre"></div></div>`;
    }
    stage().innerHTML = `<button class="turn l" data-turn="l" aria-label="${S.vert ? "次のページ" : "前のページ"}">‹</button>
      <div class="spread${n === 2 ? " two" : ""}" style="${vars}">${sheets}</div>
      <button class="turn r" data-turn="r" aria-label="${S.vert ? "前のページ" : "次のページ"}">›</button>`;
    L = { ...g, n, flows:[...stage().querySelectorAll(".flow")], sheets:[...stage().querySelectorAll(".sheet")], bmPage:null };
    L.pages = countPages();
    notePages();
    let p = 0;
    if (target?.block) p = pageOfPoint(target.block, target.off) ?? 0;
    else if (target?.last) p = L.pages - 1;
    else if (target?.page != null) p = target.page;
    show(p, true);
  }

  const stepPx = () => S.vert ? L.th + L.cg : L.tw + L.cg;
  function pageOfRect(rect, base) {
    const d = S.vert ? rect.top - base.top : rect.left - base.left;
    return Math.max(0, Math.floor((d + 2) / stepPx()));
  }
  function countPages() {
    const f = L.flows[0], base = f.getBoundingClientRect();
    let max = 0;
    for (const el of f.children) {
      const rs = el.getClientRects(); if (!rs.length) continue;
      max = Math.max(max, pageOfRect(rs[rs.length - 1], base));
    }
    return max + 1;
  }
  function pageOfBlock(id) {
    const f = L.flows[0], el = f.querySelector(`[data-id="${CSS.escape(id)}"]`);
    const r = el?.getClientRects()[0];
    return r ? pageOfRect(r, f.getBoundingClientRect()) : null;
  }
  /* 段落の途中の文字位置まで覚えて、組み直しても同じページに戻れるようにする
     （段落がページをまたぐと、段落の頭のページに戻ってしまっていたため） */
  function textPoint(el, off) {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n, o = off;
    while ((n = w.nextNode())) { if (o < n.length) return [n, o]; o -= n.length; }
    return null;
  }
  function pageAtOff(el, off, base) {
    const pt = textPoint(el, off); if (!pt) return null;
    const r = document.createRange();
    r.setStart(pt[0], pt[1]); r.setEnd(pt[0], Math.min(pt[0].length, pt[1] + 1));
    const rs = r.getClientRects();
    return rs.length ? pageOfRect(rs[0], base) : null;
  }
  function pageOfPoint(id, off) {
    if (!off) return pageOfBlock(id);
    const f = L.flows[0], el = f.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!el) return null;
    return pageAtOff(el, off, f.getBoundingClientRect()) ?? pageOfBlock(id);
  }
  // いま見ているページの先頭の位置（段落ID＋その段落の中の何文字目か）
  function anchorAt(k = S.page || 0) {
    const el = blockAtPage(k); if (!el) return null;
    const base = L.flows[0].getBoundingClientRect(), r0 = el.getClientRects()[0];
    if (!r0 || pageOfRect(r0, base) >= k) return { block:el.dataset.id, off:0 };
    let lo = 0, hi = el.textContent.length - 1, ans = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1, pg = pageAtOff(el, mid, base);
      if (pg == null || pg < k) lo = mid + 1; else { ans = mid; hi = mid - 1; }
    }
    return { block:el.dataset.id, off:ans };
  }
  function blockAtPage(k) {
    const f = L?.flows[0]; if (!f) return null;
    const base = f.getBoundingClientRect();
    for (const el of f.querySelectorAll(".blk")) {
      const rs = el.getClientRects(); if (!rs.length) continue;
      if (pageOfRect(rs[rs.length - 1], base) >= k) return el;
    }
    return null;
  }

  // keep が無い（ページを送った・飛んだ）ときは、覚えていた読み位置を捨てて今のページから取り直す
  function show(p, keep) {
    if (!L) return;
    if (!keep) S.anchor = null;
    p = Math.max(0, Math.min(L.pages - 1, p));
    if (L.n === 2) p -= p % 2;
    S.page = p;
    const step = stepPx(), off = bookOffset();
    L.flows.forEach((f, i) => {
      const q = p + i, blank = q >= L.pages, sh = L.sheets[i];
      f.style.transform = S.vert ? `translateY(${-q * step}px)` : `translateX(${-q * step}px)`;
      f.style.visibility = blank ? "hidden" : "";
      sh.querySelector(".nombre").textContent = blank ? "" : String((off ?? 0) + q + 1);
      sh.querySelector(".runhead").style.visibility = blank ? "hidden" : "";
      sh.querySelector(".ribbon")?.remove();
    });
    const bm = S.bms[S.cur.bid];
    if (bm && bm.no === S.ch.no) {
      if (L.bmPage == null) L.bmPage = pageOfPoint(bm.block, bm.off);
      const i = L.bmPage - p;
      if (i >= 0 && i < L.n) L.sheets[i].insertAdjacentHTML("beforeend", '<div class="ribbon" aria-hidden="true"></div>');
    }
    const last = Math.min(L.pages, p + L.n), total = bookTotal();
    const o = total != null && off != null ? off : 0, all = total != null && off != null ? total : L.pages;
    $("#pgInfo").textContent = last > p + 1 ? `${o + p + 1}–${o + last} / ${all}` : `${o + p + 1} / ${all}`;
    $("#pbarFill").style.width = ((o + last) / all * 100).toFixed(1) + "%";
  }

  /* ---------- 本全体の通しページ番号 ----------
     ページ数は画面の大きさ・文字の大きさ・縦横で変わるので、その組み合わせごとに
     各章を見えない所で組んで数え、前の章までのページ数を足して通し番号にする */
  const PM = { key:null, counts:new Map(), tok:0 };
  const pmKey = () => L && S.cur ? [S.cur.bid, L.pw, L.ph, S.fs, S.vert ? 1 : 0].join("|") : null;
  function notePages() {
    const k = pmKey();
    if (PM.key !== k) { PM.key = k; PM.counts = new Map(); }
    PM.counts.set(S.ch.no, L.pages);
    measureBook();
  }
  function chaptersOf() { return S.catalog[S.cur.bid]?.chapters || []; }
  function bookOffset() {
    if (!L || PM.key !== pmKey()) return null;
    let o = 0;
    for (const c of chaptersOf()) { if (c.no === S.ch.no) return o; const n = PM.counts.get(c.no); if (n == null) return null; o += n; }
    return null;
  }
  function bookTotal() {
    if (!L || PM.key !== pmKey()) return null;
    let t = 0;
    for (const c of chaptersOf()) { const n = PM.counts.get(c.no); if (n == null) return null; t += n; }
    return t;
  }
  function countIn(f, step) {
    const base = f.getBoundingClientRect(); let max = 0;
    for (const el of f.children) {
      const rs = el.getClientRects(); if (!rs.length) continue;
      const r = rs[rs.length - 1], d = S.vert ? r.top - base.top : r.left - base.left;
      max = Math.max(max, Math.floor((d + 2) / step));
    }
    return max + 1;
  }
  async function measureBook() {
    const tok = ++PM.tok, key = PM.key, bundle = S.bundles.get(S.cur.bid);
    if (!bundle) return;
    const todo = chaptersOf().filter(c => !PM.counts.has(c.no));
    if (!todo.length) return;
    const box = document.createElement("div");
    box.className = "spread"; box.setAttribute("aria-hidden", "true");
    box.style.cssText = stage().querySelector(".spread").getAttribute("style") + ";position:absolute;left:-200000px;top:0;visibility:hidden;pointer-events:none";
    box.innerHTML = '<div class="sheet"><div class="vp"><div class="flow"></div></div></div>';
    stage().appendChild(box);
    const f = box.querySelector(".flow"), step = stepPx();
    try {
      for (const c of todo) {
        await new Promise(r => setTimeout(r, 0));              // 画面の操作を止めないよう1章ずつ
        if (tok !== PM.tok || key !== pmKey() || !box.isConnected) return;
        const ch = bundle.chapters.find(x => x.no === c.no);
        if (!ch) { PM.counts.set(c.no, 0); continue; }
        f.innerHTML = chapterHTML(ch);
        PM.counts.set(c.no, countIn(f, step));
      }
    } finally { box.remove(); }
    if (tok === PM.tok && key === pmKey() && L) show(S.page, true);
  }

  function next() {
    if (!L) return;
    if (S.page + L.n < L.pages) show(S.page + L.n); else goChapter(1);
  }
  function prev() {
    if (!L) return;
    if (S.page > 0) show(S.page - L.n); else goChapter(-1);
  }
  function goChapter(dir) {
    const chs = S.catalog[S.cur.bid].chapters || [], i = chs.findIndex(c => c.no === S.ch.no), t = chs[i + dir];
    if (!t) { status(dir > 0 ? "この本の最後です。" : "この本の最初です。"); setTimeout(() => status(""), 1800); return; }
    openChapter(S.cur.bid, t.no, false, null, dir < 0);
  }
  const turn = side => (side === "l") === S.vert ? next() : prev();   // 縦書きは左へ進む

  /* ---------- 見開きをまたぐ選択 ----------
     左右のページは同じ本文を2つ並べて、ずらして見せている。そのため、ページをまたいで選ぶと
     別々の本文にまたがってしまい、見えない部分まで選ばれる。
     → 選択は書き始めたページの本文の中だけに直し、もう一方のページには同じ範囲を色付けして見せる */
  const pathOf = (node, root) => { const p = []; while (node && node !== root) { const par = node.parentNode; if (!par) return null; p.push(Array.prototype.indexOf.call(par.childNodes, node)); node = par; } return node === root ? p.reverse() : null; };
  const nodeAt = (root, p) => { let n = root; for (const i of p) { n = n?.childNodes[i]; if (!n) return null; } return n; };
  const flowOf = n => (n?.nodeType === 1 ? n : n?.parentElement)?.closest?.(".flow") || null;
  const HL = "CSS" in window && CSS.highlights && typeof Highlight === "function";
  function mirror(range, from, to) {
    const a = pathOf(range.startContainer, from), b = pathOf(range.endContainer, from);
    if (!a || !b) return null;
    const sn = nodeAt(to, a), en = nodeAt(to, b);
    if (!sn || !en) return null;
    const r = document.createRange();
    try { r.setStart(sn, range.startOffset); r.setEnd(en, range.endOffset); } catch { return null; }
    return r;
  }
  let fixing = false;
  document.addEventListener("selectionchange", () => {
    if (fixing) return;
    const sel = getSelection();
    if (!L || !sel.rangeCount || sel.isCollapsed) { if (HL) CSS.highlights.delete("xsel"); return; }
    const fa = flowOf(sel.anchorNode), ff = flowOf(sel.focusNode);
    if (!fa || !L.flows.includes(fa)) { if (HL) CSS.highlights.delete("xsel"); return; }
    // 終わりが別のページの本文にある → 書き始めたページの本文の同じ場所に置き換える
    if (ff && ff !== fa && L.flows.includes(ff)) {
      const p = pathOf(sel.focusNode, ff), n = p && nodeAt(fa, p);
      if (n) {
        fixing = true;
        try { sel.setBaseAndExtent(sel.anchorNode, sel.anchorOffset, n, Math.min(sel.focusOffset, n.nodeType === 3 ? n.length : n.childNodes.length)); } catch {}
        fixing = false;
      }
    } else if (!ff || !fa.contains(sel.focusNode)) {
      return;      // 本文の外（余白など）にいる間はそのまま
    }
    if (!HL) return;
    const r = sel.getRangeAt(0), others = [];
    for (const f of L.flows) if (f !== fa) { const m = mirror(r, fa, f); if (m) others.push(m); }
    if (others.length) CSS.highlights.set("xsel", new Highlight(...others)); else CSS.highlights.delete("xsel");
  });

  stage().addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) return openChapter(S.cur.bid, Number(g.dataset.go));
    const t = e.target.closest("[data-turn]");
    if (t) turn(t.dataset.turn);
  });
  document.addEventListener("keydown", e => {
    if (!L || !$("#gate").hidden || e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft") { turn("l"); e.preventDefault(); }
    else if (e.key === "ArrowRight") { turn("r"); e.preventDefault(); }
    else if (e.key === "PageDown" || e.key === " ") { next(); e.preventDefault(); }
    else if (e.key === "PageUp") { prev(); e.preventDefault(); }
  });
  let wheelAt = 0;
  stage().addEventListener("wheel", e => {
    if (!L) return;
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? (S.vert ? -e.deltaX : e.deltaX) : e.deltaY;
    if (Math.abs(d) < 8 || Date.now() - wheelAt < 380) return;
    wheelAt = Date.now(); d > 0 ? next() : prev();
  }, { passive:false });
  // iOS Safari はピンチでの拡大を viewport の指定だけでは止めないため、ここでも止める
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
  // 本文の上で指を動かしても、画面が動かないようにする（めくりは指を離したときに判定）
  stage().addEventListener("touchmove", e => { if (e.cancelable && getSelection().isCollapsed) e.preventDefault(); }, { passive:false });
  let sx = null, sy = 0;
  stage().addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
  stage().addEventListener("pointerup", e => {
    if (sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    (dx > 0) === S.vert ? next() : prev();       // 縦書きは右へめくると次へ
  });

  function jump(id, quiet, off) {
    if (!L) return;
    const p = pageOfPoint(id, off); if (p == null) return;
    show(p);
    if (quiet) return;
    const els = stage().querySelectorAll(`[data-id="${CSS.escape(id)}"]`);
    els.forEach(el => el.classList.add("hit"));
    setTimeout(() => els.forEach(el => el.classList.remove("hit")), 2400);
  }
  const firstVisible = () => blockAtPage(S.page || 0);
  // force が無ければ、ページの大きさが変わっていないときは組み直さない
  function relayout(force) {
    if (!L || !S.ch) return;
    if (force !== true) { const g = geometry(); if (g.pw === L.pw && g.ph === L.ph && g.spread === (L.n === 2)) return; }
    layout(S.anchor || (S.anchor = anchorAt()) || { page:0 });
  }
  let rzT = 0;
  new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(relayout, 120); }).observe(stage());
  document.fonts?.ready.then(() => relayout(true));
  // 文字の形（Webフォント）が後から届いたときも、今のページのまま組み直す
  let fontT = 0;
  document.fonts?.addEventListener?.("loadingdone", () => { clearTimeout(fontT); fontT = setTimeout(() => relayout(true), 300); });

  /* ---------- 組み方・文字・全画面・しおり ---------- */
  function applyMode() {
    $("#reader").classList.toggle("vert", S.vert);
    document.querySelectorAll("[data-wm]").forEach(b => b.classList.toggle("on", (b.dataset.wm === "v") === S.vert));
  }
  document.querySelectorAll("[data-wm]").forEach(b => b.onclick = () => {
    const v = b.dataset.wm === "v"; if (v === S.vert) return;
    const a = L ? (S.anchor || (S.anchor = anchorAt())) : null;
    S.vert = v; savePrefs(); applyMode();
    if (S.ch) layout(a || { page:0 });
  });
  const setFs = d => {
    S.fs = Math.min(24, Math.max(13, S.fs + d)); savePrefs(); relayout(true);
  };
  $("#fsDown").onclick = () => setFs(-1);
  $("#fsUp").onclick = () => setFs(1);

  function setFull(on) {
    S.full = on; document.body.classList.toggle("full", on);
    $("#fullLbl").textContent = on ? "全画面を終了" : "全画面";
  }
  $("#fullBtn").onclick = () => setFull(!S.full);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.full) setFull(false); });

  function updateBmGo() { $("#bmGo").hidden = !S.bms[S.cur?.bid]; }
  $("#bmHere").onclick = () => {
    const a = L && anchorAt(); if (!a || !S.cur) return;
    S.bms[S.cur.bid] = { no:S.cur.no, block:a.block, off:a.off, at:Date.now() };
    ls.set(BMS, S.bms); updateBmGo(); renderShelf();
    if (L) { L.bmPage = null; show(S.page, true); }
    status("しおりを挟みました（この端末に保存）。"); setTimeout(() => status(""), 2500);
  };
  $("#bmGo").onclick = () => {
    const bm = S.bms[S.cur?.bid]; if (!bm) return;
    if (bm.no === S.cur.no) jump(bm.block, false, bm.off); else openChapter(S.cur.bid, bm.no, false, () => jump(bm.block, false, bm.off));
  };

  /* ---------- 変換管理（未変換・変換待ち・変換済み） ---------- */
  const M = { f:"all", q:"", sel:new Set(), limit:300, view:ls.get("shoko.mview", "list") };
  const ST_LABEL = { todo:"未変換", queue:"変換待ち", done:"変換済み" };
  const b64big = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
  const apiHeaders = () => ({ Authorization:"Bearer " + secret.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" });

  // 本棚・変換管理・夜間処理の切り替え（name が null なら本棚）
  function setPanel(name) {
    S.panel = name; S.managing = name === "manage";
    if (name && S.full) setFull(false);
    $("#manage").hidden = name !== "manage"; $("#night").hidden = name !== "night";
    $("#app").hidden = !!name; $("#tabbar").hidden = !!name; $("#q").hidden = !!name;
    const back = '本棚へ<span class="lbl">戻る</span>';
    $("#manageBtn").setAttribute("aria-pressed", String(name === "manage"));
    $("#manageBtn").innerHTML = name === "manage" ? back : '変換<span class="lbl">管理</span>';
    $("#nightBtn").setAttribute("aria-pressed", String(name === "night"));
    $("#nightBtn").innerHTML = name === "night" ? back : '夜間<span class="lbl">処理</span>';
    try { history.replaceState(null, "", name ? "#" + name : location.pathname + location.search); } catch {}
    if (name === "manage") { if (!S.inv) loadManage(); else renderManage(); }
    else if (name === "night") loadNight();
    else if (L) requestAnimationFrame(relayout);
  }
  const setManage = on => setPanel(on ? "manage" : null);
  $("#manageBtn").onclick = () => setPanel(S.panel === "manage" ? null : "manage");
  $("#nightBtn").onclick = () => setPanel(S.panel === "night" ? null : "night");

  async function loadQueue() {
    let r;
    try { r = await fetch(apiURL("queue.json.age"), { cache:"no-store", headers:apiHeaders() }); }
    catch { throw new Error(navigator.onLine ? "GitHub につながりませんでした。" : "オフラインのため、変換待ちの一覧を読めません。"); }
    if (r.status === 404) { S.queue = []; S.qsha = null; return; }
    if (!r.ok) throw new Error("変換待ちの一覧を読めませんでした（" + r.status + "）。");
    const j = await r.json();
    S.qsha = j.sha;
    const bytes = unb64(String(j.content || "").replace(/\s/g, ""));
    try { S.queue = JSON.parse(await dec.decrypt(bytes, "text")).items || []; }
    catch { throw new Error("変換待ちの一覧を復号できませんでした。"); }
  }
  async function saveQueue(items) {
    if (!navigator.onLine) throw new Error("オフラインのため保存できません。通信できる所で操作してください。");
    const e = new AgeLib.Encrypter();
    e.addRecipient(await AgeLib.identityToRecipient(secret.key));
    const ct = await e.encrypt(JSON.stringify({ items, updated:new Date().toISOString() }));
    const body = { message:`変換待ちを更新（${items.length}冊）`, content:b64big(ct) };
    if (S.qsha) body.sha = S.qsha;
    const r = await fetch(apiURL("queue.json.age"), { method:"PUT", headers:{ ...apiHeaders(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
    if (r.status === 403 || r.status === 404)
      throw new Error("保存できません。トークンの Contents の権限を「Read and write」にしてください。");
    if (r.status === 409 || r.status === 422) { await loadQueue(); throw new Error("別の端末で変換待ちが変わっていたので読み直しました。もう一度操作してください。"); }
    if (!r.ok) throw new Error("保存に失敗しました（" + r.status + "）。");
    S.qsha = (await r.json()).content?.sha || null;
    S.queue = items;
  }

  async function loadManage() {
    $("#mlist").innerHTML = '<div class="empty">一覧を読み込み中…</div>'; $("#mnote").textContent = "";
    try {
      const inv = await getJSON("inventory.json.age").catch(e => {
        if (/見つかりません|まだありません/.test(e.message)) throw new Error("本の一覧がまだ GitHub にありません。Mac で epub2gh を一度実行すると作られます。");
        throw e;
      });
      const seen = new Set();
      S.inv = (inv.books || []).filter(b => b.bid && !seen.has(b.bid) && seen.add(b.bid));
      await loadQueue();
      M.sel.clear();
      renderManage();
    } catch (e) { $("#mlist").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  const stOf = (bid, qset) => S.catalog[bid] ? "done" : qset.has(bid) ? "queue" : "todo";
  function renderManage() {
    if (!S.inv) return;
    const qpos = new Map(S.queue.map((x, i) => [x.bid, i]));
    const qset = new Set(qpos.keys());
    const cnt = { all:S.inv.length, todo:0, queue:0, done:0 };
    for (const b of S.inv) cnt[stOf(b.bid, qset)]++;
    document.querySelectorAll("#mfilter button").forEach(b => {
      b.classList.toggle("on", b.dataset.f === M.f);
      b.querySelector(".n").textContent = cnt[b.dataset.f];
    });
    $("#mnote").textContent = cnt.queue
      ? `変換待ちは ${cnt.queue} 冊です。Mac は毎日23時に、上から順に1日20冊まで変換します（今のままなら約${Math.ceil(cnt.queue / 20)}日で終わります）。`
      : "未変換の本を選んで「変換待ちにする」を押すと、Mac が毎日23時に変換します。";
    const q = M.q.toLowerCase();
    const rank = b => { const st = stOf(b.bid, qset); return st === "queue" ? qpos.get(b.bid) : st === "todo" ? 1e6 : 2e6; };
    const list = S.inv
      .filter(b => M.f === "all" || stOf(b.bid, qset) === M.f)
      .filter(b => !q || (b.title + " " + (b.authors || []).join(" ")).toLowerCase().includes(q))
      .sort((a, b) => rank(a) - rank(b) || String(b.added || "").localeCompare(String(a.added || "")) || String(a.title).localeCompare(String(b.title), "ja"));
    if (!list.length) { $("#mlist").innerHTML = '<div class="empty">該当する本はありません。</div>'; updateMButtons(qset); return; }
    const shown = list.slice(0, M.limit);
    document.querySelectorAll("#mview button").forEach(b => b.classList.toggle("on", b.dataset.v === M.view));
    const more = list.length > shown.length ? `<button class="mmore" id="mMore">さらに表示（残り ${list.length - shown.length} 冊）</button>` : "";
    if (M.view === "grid") {
      $("#mlist").innerHTML = `<div class="mgrid">${shown.map(b => {
        const st = stOf(b.bid, qset), on = M.sel.has(b.bid);
        const label = st === "queue" ? `待ち ${qpos.get(b.bid) + 1}` : ST_LABEL[st];
        const au = (b.authors || []).join(" / ");
        return `<label class="mcard ${st}${on ? " sel" : ""}" title="${esc(b.title)}">
          <input type="checkbox" data-mb="${esc(b.bid)}"${on ? " checked" : ""}${st === "done" ? " disabled" : ""} aria-label="${esc(b.title)}を選ぶ">
          <span class="mst ${st}">${label}</span>
          <span class="mcover" style="--h:${hashHue(b.title)}" data-thumb="${esc(b.bid)}">
            <span class="ph" aria-hidden="true"><b>${esc(b.title)}</b><i>${esc(au || String(b.type || "").toUpperCase())}</i></span>
          </span>
          <span class="mct">${esc(b.title)}</span>
          <span class="mca">${esc(au)}${au ? "　" : ""}${esc(String(b.type || "").toUpperCase())}</span>
        </label>`;
      }).join("")}</div>` + more;
      watchThumbs();
      updateMButtons(qset);
      return;
    }
    $("#mlist").innerHTML = shown.map(b => {
      const st = stOf(b.bid, qset), on = M.sel.has(b.bid);
      const label = st === "queue" ? `変換待ち ${qpos.get(b.bid) + 1}番目` : ST_LABEL[st];
      return `<label class="mrow">
        <input type="checkbox" data-mb="${esc(b.bid)}"${on ? " checked" : ""}${st === "done" ? " disabled" : ""} aria-label="${esc(b.title)}を選ぶ">
        <span><span class="mt">${esc(b.title)}</span><br><span class="mm">${esc((b.authors || []).join(" / "))}${(b.authors || []).length ? "　" : ""}${esc(String(b.type || "").toUpperCase())}${b.added ? "・" + esc(b.added) + " 追加" : ""}</span></span>
        <span class="mst ${st}">${label}</span>
      </label>`;
    }).join("") + (list.length > shown.length ? `<button class="mmore" id="mMore">さらに表示（残り ${list.length - shown.length} 冊）</button>` : "");
    updateMButtons(qset);
  }
  function updateMButtons(qset = new Set((S.queue || []).map(x => x.bid))) {
    const sel = [...M.sel];
    const nAdd = sel.filter(b => stOf(b, qset) === "todo").length, nDel = sel.filter(b => stOf(b, qset) === "queue").length;
    $("#mAdd").disabled = !nAdd; $("#mDel").disabled = !nDel;
    $("#mAdd").textContent = nAdd ? `変換待ちにする（${nAdd}）` : "変換待ちにする";
    $("#mDel").textContent = nDel ? `変換待ちから外す（${nDel}）` : "変換待ちから外す";
  }
  $("#mfilter").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { M.f = b.dataset.f; M.limit = 300; renderManage(); } });
  $("#mq").addEventListener("input", e => { M.q = e.target.value.trim(); M.limit = 300; renderManage(); });
  $("#mlist").addEventListener("change", e => {
    const c = e.target.closest("[data-mb]"); if (!c) return;
    c.checked ? M.sel.add(c.dataset.mb) : M.sel.delete(c.dataset.mb);
    c.closest(".mcard")?.classList.toggle("sel", c.checked);
    updateMButtons();
  });
  $("#mlist").addEventListener("click", e => { if (e.target.id === "mMore") { M.limit += 300; renderManage(); } });
  async function changeQueue(add) {
    const btn = add ? $("#mAdd") : $("#mDel"), keep = btn.textContent;
    const qset = new Set(S.queue.map(x => x.bid));
    const byId = new Map(S.inv.map(b => [b.bid, b]));
    let items;
    if (add) {
      const now = new Date().toISOString();
      const adds = [...M.sel].filter(b => stOf(b, qset) === "todo").map(b => ({ bid:b, title:byId.get(b)?.title || "", added:now }));
      items = [...S.queue, ...adds];
    } else items = S.queue.filter(x => !M.sel.has(x.bid));
    btn.disabled = true; btn.textContent = "保存中…";
    try {
      await saveQueue(items);
      M.sel.clear();
      status(add ? "変換待ちにしました。Mac の次の実行（23時）で変換されます。" : "変換待ちから外しました。");
      setTimeout(() => status(""), 3500);
    } catch (err) { status(err.message); }
    btn.textContent = keep;
    renderManage();
  }
  $("#mview").addEventListener("click", e => {
    const b = e.target.closest("[data-v]"); if (!b || b.dataset.v === M.view) return;
    M.view = b.dataset.v; ls.set("shoko.mview", M.view); renderManage();
  });

  /* ---------- 表紙のサムネイル（Mac が thumbs/<本のID>.jpg.age として暗号化して置く） ---------- */
  const hashHue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; };
  const TH = { urls:new Map(), none:new Set(), queue:[], busy:0 };
  async function fetchThumb(bid) {
    const url = apiURL(`thumbs/${encodeURIComponent(bid)}.jpg.age`);
    const r = await fetch(url, { headers:{ Authorization:"Bearer " + secret.token, Accept:"application/vnd.github.raw+json", "X-GitHub-Api-Version":"2022-11-28" } });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(String(r.status));
    const plain = await dec.decrypt(new Uint8Array(await r.arrayBuffer()));
    return URL.createObjectURL(new Blob([plain], { type:"image/jpeg" }));
  }
  function putThumb(el, u) {
    if (!u || el.querySelector("img")) return;
    const img = new Image(); img.alt = ""; img.decoding = "async";
    img.onload = () => img.classList.add("on");
    img.src = u; el.appendChild(img);
  }
  function pumpThumbs() {
    while (TH.busy < 6 && TH.queue.length) {
      const el = TH.queue.shift(), bid = el.dataset.thumb;
      if (!el.isConnected) continue;
      if (TH.urls.has(bid)) { putThumb(el, TH.urls.get(bid)); continue; }
      if (TH.none.has(bid)) continue;
      TH.busy++;
      fetchThumb(bid).then(u => {
        if (u) { TH.urls.set(bid, u); document.querySelectorAll(`[data-thumb="${CSS.escape(bid)}"]`).forEach(x => putThumb(x, u)); }
        else TH.none.add(bid);
      }).catch(() => {}).finally(() => { TH.busy--; pumpThumbs(); });
    }
  }
  const IOS = new Map();       // 画面（本棚・変換管理）ごとの見張り
  function watchThumbs(box = $("#mlist"), root = $("#manage")) {
    IOS.get(root)?.disconnect();
    const els = [...box.querySelectorAll("[data-thumb]")];
    const want = el => { const bid = el.dataset.thumb; if (TH.urls.has(bid)) putThumb(el, TH.urls.get(bid)); else if (!TH.none.has(bid)) TH.queue.push(el); };
    if (!("IntersectionObserver" in window)) { els.forEach(want); return pumpThumbs(); }
    const io = new IntersectionObserver(ents => {
      for (const en of ents) if (en.isIntersecting) { io.unobserve(en.target); want(en.target); }
      pumpThumbs();
    }, { root, rootMargin:"400px 0px" });
    IOS.set(root, io);
    els.forEach(el => io.observe(el));
  }

  $("#mAdd").onclick = () => changeQueue(true);
  $("#mDel").onclick = () => changeQueue(false);

  /* ---------- 夜間処理の状況 ---------- */
  const N = { sel:0 };
  const jdt = t => { const d = new Date(t); return isNaN(d) ? String(t || "") : d.toLocaleString("ja-JP", { month:"numeric", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit" }); };
  const dur = (a, b) => { const s = Math.max(0, Math.round((new Date(b) - new Date(a)) / 1000)); return s >= 60 ? `${Math.floor(s / 60)}分${s % 60}秒` : `${s}秒`; };
  const titleOf = bid => S.catalog[bid]?.title || (S.inv || []).find(b => b.bid === bid)?.title || bid;
  function nextRun() {
    const d = new Date(), n = new Date(d); n.setHours(23, 0, 0, 0);
    if (n <= d) n.setDate(n.getDate() + 1);
    return (n.getDate() === d.getDate() ? "今日" : "明日") + " 23:00";
  }
  async function loadCommits() {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(secret.owner)}/${encodeURIComponent(secret.repo)}/commits?per_page=20`, { cache:"no-store", headers:apiHeaders() });
    if (!r.ok) throw new Error(String(r.status));
    return (await r.json()).map(c => ({ at:c.commit?.committer?.date || c.commit?.author?.date, msg:String(c.commit?.message || "").split("\n")[0] }));
  }
  async function loadNight() {
    const el = $("#night");
    el.innerHTML = '<div class="empty">夜間処理の記録を読み込み中…</div>';
    const [st, commits, inv, q] = await Promise.all([
      getJSON("status.json.age").catch(() => null),
      loadCommits().catch(() => null),
      S.inv ? Promise.resolve(S.inv) : getJSON("inventory.json.age").then(j => (j.books || [])).catch(() => null),
      S.queue ? Promise.resolve(S.queue) : loadQueue().then(() => S.queue).catch(() => null),
    ]);
    if (inv && !S.inv) { const seen = new Set(); S.inv = inv.filter(b => b.bid && !seen.has(b.bid) && seen.add(b.bid)); }
    N.st = st; N.commits = commits; N.sel = 0;
    renderNight();
  }
  function renderNight() {
    const el = $("#night"), st = N.st, runs = st?.runs || [], last = runs[0];
    const limit = st?.limit || 20;
    const qLeft = (S.queue || []).filter(x => !S.catalog[x.bid]).length;
    const todo = S.inv ? S.inv.filter(b => !S.catalog[b.bid]).length : null;
    const ok = last && last.code === 0 && !(last.errors || []).length;
    let h = `<h2>夜間処理の状況</h2><div class="nmet">`;
    if (last) {
      h += `<div class="nm ${ok ? "ok" : "ng"}"><div class="l">前回の実行</div><div class="v">${ok ? "正常に終了" : last.code ? "失敗" : "エラーあり"}</div><div class="s">${esc(jdt(last.start))}・${esc(dur(last.start, last.end))}</div></div>
        <div class="nm"><div class="l">前回変換した本</div><div class="v">${(last.converted || []).length}冊</div><div class="s">1日 ${limit}冊まで</div></div>`;
    } else {
      const lc = (N.commits || []).find(c => !/変換待ちを更新/.test(c.msg));
      h += `<div class="nm"><div class="l">最後に Mac から届いた更新</div><div class="v" style="font-size:17px">${lc ? esc(jdt(lc.at)) : "—"}</div><div class="s">${lc ? esc(lc.msg.slice(0, 40)) : "記録がありません"}</div></div>`;
    }
    h += `<div class="nm"><div class="l">変換待ち（残り）</div><div class="v">${S.queue ? qLeft + "冊" : "—"}</div><div class="s">${qLeft ? `今のままなら約${Math.ceil(qLeft / limit)}日で終わります` : S.queue ? "待っている本はありません" : "読み込めませんでした"}</div></div>
      <div class="nm"><div class="l">未変換（NAS 全体）</div><div class="v">${todo == null ? "—" : todo + "冊"}</div><div class="s">変換済み ${Object.keys(S.catalog).length}冊</div></div>
      <div class="nm"><div class="l">次の実行</div><div class="v" style="font-size:17px">${nextRun()}</div><div class="s">Mac がスリープ中なら起きたときに実行</div></div></div>`;

    if (runs.length) {
      const r = runs[Math.min(N.sel, runs.length - 1)];
      h += `<h3>${N.sel ? esc(jdt(r.start)) + " の結果" : "前回の結果"}</h3>`;
      const errs = r.errors || [];
      h += `<div class="nrows">${(r.converted || []).map(bid => `<div class="nr"><span class="d">変換しました</span><span class="ttl">${esc(titleOf(bid))}</span></div>`).join("")}
        ${errs.map(e => `<div class="nr err"><span class="d">エラー</span><span>${esc(e)}</span></div>`).join("")}
        ${!(r.converted || []).length && !errs.length ? `<div class="nr"><span class="d">結果</span><span>変換する本はありませんでした${r.code ? `（終了コード ${r.code}）` : ""}</span></div>` : ""}</div>`;
      if ((r.tail || []).length) h += `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--muted)">ログの最後の部分を見る</summary><div class="ntail">${esc(r.tail.join("\n"))}</div></details>`;
      h += `<h3>実行の記録（直近${runs.length}回）</h3><div class="nwrap"><table class="ntable"><thead><tr><th>日時</th><th>かかった時間</th><th>変換</th><th>エラー</th><th>結果</th></tr></thead><tbody>
        ${runs.map((x, i) => { const good = x.code === 0 && !(x.errors || []).length;
          return `<tr data-run="${i}"${i === N.sel ? ' class="sel"' : ""}><td>${esc(jdt(x.start))}</td><td>${esc(dur(x.start, x.end))}</td><td class="num">${(x.converted || []).length}冊</td><td class="num">${(x.errors || []).length}</td><td class="${good ? "ngood" : "nbad"}">${good ? "正常" : x.code ? "失敗" : "エラーあり"}</td></tr>`; }).join("")}
        </tbody></table></div>`;
    } else {
      const recent = Object.entries(S.catalog).map(([bid, b]) => ({ bid, ...b })).filter(b => b.converted)
        .sort((a, b) => String(b.converted).localeCompare(String(a.converted))).slice(0, 12);
      h += `<div class="nnote">実行ごとの詳しい記録（変換した本・エラー・ログ）はまだありません。Mac の <code>~/scripts/bookscan</code> に <b>nightly_status.py</b> を置き、<b>install-agent.sh</b> で登録し直すと、次の23時の実行からここに出ます。</div>`;
      h += `<h3>最近変換した本</h3><div class="nrows">${recent.map(b => `<div class="nr"><span class="d">${esc(String(b.converted).slice(0, 16).replace("T", " "))}</span><span class="ttl">${esc(b.title)}</span></div>`).join("") || '<div class="nr">まだありません。</div>'}</div>`;
    }
    if (N.commits?.length) {
      h += `<h3>GitHub の更新履歴</h3><div class="nrows">${N.commits.slice(0, 12).map(c => `<div class="nr"><span class="d">${esc(jdt(c.at))}</span><span>${esc(c.msg)}</span></div>`).join("")}</div>`;
    } else if (!navigator.onLine) h += `<p class="nnote">オフラインのため、最新の状況を読み込めませんでした。</p>`;
    el.innerHTML = h;
  }
  $("#night").addEventListener("click", e => { const r = e.target.closest("[data-run]"); if (r) { N.sel = Number(r.dataset.run); renderNight(); } });

  /* ---------- スマホのタブ ---------- */
  function setMobile(m) {
    document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    $("#shelf").classList.toggle("show", m === "shelf");
    $("#reader").classList.toggle("show", m === "reader");
  }
  $("#tabbar").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) setMobile(b.dataset.m); });

  // しばらく操作がないと鍵をかける（30分）
  let idle; const poke = () => { clearTimeout(idle); if (secret) idle = setTimeout(lock, 30 * 60 * 1000); };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(t => addEventListener(t, poke, { passive:true }));

  if (!window.crypto?.subtle) {
    $("#gateLead").textContent = "このブラウザでは使えません（https で開いてください）。";
  } else showGate();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#26335a">
<title>議事録</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main id="gate" class="gate" aria-label="ログイン"></main>

<div id="app" hidden>
  <header class="top">
    <div class="brand">議事録</div>
    <nav class="tabs" aria-label="画面">
      <button data-act="tab" data-tab="list">一覧</button>
      <button data-act="tab" data-tab="notes">ノート</button>
      <button data-act="tab" data-tab="convert">変換管理 <span class="badge" hidden></span></button>
    </nav>
    <div class="search" id="searchBox">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="q" class="sr">タイトル・タグ・要約を検索</label>
      <input id="q" type="search" placeholder="タイトル・タグ・要約を検索">
    </div>
    <span class="sync" id="sync" role="status"></span>
    <span class="role" id="role"></span>
    <button class="btn up" data-act="upload">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>登録</button>
    <button class="ib hdr" data-act="settings" aria-label="設定">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ib hdr" data-act="lock" aria-label="鍵をかける">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </header>
  <div id="main" class="main"></div>
  <nav class="tabbar" aria-label="画面">
    <button data-act="tab" data-tab="list">一覧</button>
    <button data-act="tab" data-tab="notes">ノート</button>
    <button data-act="tab" data-tab="convert">変換管理 <span class="badge" hidden></span></button>
  </nav>
</div>

<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
